<!DOCTYPE html>
<html lang="en-US" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="initial-scale=1, width=device-width"/>
    <th:block th:replace="~{fragments/pwa-meta :: pwa-meta}"></th:block>
    <link rel="stylesheet" href="/static/styles/global.css"/>
    <link rel="stylesheet" href="/static/styles/profile.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800;900&display=swap">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title th:text="${toolName} + ' Usage - DMS Member Portal'">Tool Usage - DMS Member Portal</title>
</head>
<body>
<header class="top-nav" th:replace="~{fragments/header :: header}"></header>
<div class="container-fluid container-lg pb-5 px-3 px-lg-4">
    <div class="row mt-4 mb-3">
        <div class="col-12">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="/interlock-tools">Tool Interlocks</a></li>
                    <li class="breadcrumb-item active" th:text="${toolName}"></li>
                </ol>
            </nav>
            <h1 class="mb-1" th:text="${toolName}">Tool Name</h1>
            <p class="text-muted mb-0">
                <a th:href="'/committees/' + ${committeeSlug}" class="text-decoration-none"
                   th:text="${committeeName} + ' Committee'"></a>
            </p>
        </div>
    </div>

    <div class="row mb-4">
        <div class="col-12">
            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-auto pe-5">
                            <span class="text-muted small d-block">Prerequisite</span>
                            <dms-group-pill th:if="${prerequisiteGroup != null}"
                                            th:attr="name=${prerequisiteGroup},slug=${prerequisiteGroupSlug}">
                            </dms-group-pill>
                            <span th:if="${prerequisiteGroup == null}" class="text-muted">—</span>
                        </div>
                        <div class="col-auto pe-5">
                            <span class="text-muted small d-block">Idle Timeout</span>
                            <strong th:text="${timeoutSeconds} + 's'"></strong>
                        </div>
                        <div class="col-auto">
                            <span class="text-muted small d-block">Tag</span>
                            <code th:text="${toolTag}"></code>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row mb-3">
        <div class="col-12">
            <a th:href="'/interlock-tools?tool=' + ${toolTag} + '&view=reports'"
               class="btn btn-sm btn-outline-secondary">View Reports for this tool</a>
        </div>
    </div>

    <div class="row">
        <div class="col-12">
            <dms-data-visualizer
                    th:attr="dataUrl='/backend-api/data-viz/interlock-usage?tool=' + ${toolTag} + '&days=14'"
                    renderAs="table"
                    title="Usage — last 14 days"
                    filterable="true"
            ></dms-data-visualizer>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<script src="/static/js/app.js"></script>
<script src="/static/js/dms-page-loader.js" defer></script>
<script type="module" src="/static/js/dms-data-visualizer.js"></script>
<script type="module" src="/static/js/dms-group-pill.js"></script>
<script type="module" src="/static/js/dms-relative-date.js"></script>
<script type="module" src="/static/js/dms-member-card.js"></script>
</body>
</html>
