<!DOCTYPE html>
<html lang="en-US" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="initial-scale=1, width=device-width"/>

    <!-- PWA Meta Tags -->
    <th:block th:replace="~{fragments/pwa-meta :: pwa-meta}"></th:block>

    <link rel="stylesheet" href="/static/styles/global.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800;900&display=swap">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0&display=swap"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title th:text="'Notifications - @' + ${preferred_username}"></title>
</head>
<body>
<header class="top-nav" th:replace="~{fragments/header :: header}"></header>
<div class="container pb-8">
    <div class="row">
        <div class="col-md-10 col-lg-9 mx-auto">
            <!-- Back to profile link -->
            <div class="mt-4">
                <a th:href="'/profile/@' + ${preferred_username}" class="text-decoration-none">
                    <span class="material-symbols-outlined align-middle" style="font-size:18px;">arrow_back</span>
                    Back to profile
                </a>
            </div>

            <!-- Inbox card -->
            <div class="dms-card shadow-sm mt-3">
                <div class="card-body pt-0 pb-4">
                    <h4 class="card-title mt-3 mb-4 dms-card-title">Notifications</h4>
                    <p class="text-muted">
                        Recent notifications sent to you from the member portal.
                    </p>

                    <div th:if="${notifications == null or notifications.empty}" class="text-muted">
                        No notifications yet.
                    </div>
                    <div th:if="${notifications != null and !notifications.empty}"
                         class="table-responsive">
                        <table class="table table-sm">
                            <thead>
                            <tr>
                                <th scope="col">Subject</th>
                                <th scope="col">Topic</th>
                                <th scope="col">When</th>
                                <th scope="col">Status</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="n : ${notifications}">
                                <td th:text="${n['subject']}"></td>
                                <td th:text="${n['topic_display']}"></td>
                                <td>
                                    <dms-relative-date
                                            th:attr="timestamp=${n['sentAt'] != null ? n['sentAt'] : n['createdAt']}"></dms-relative-date>
                                </td>
                                <td>
                                    <span class="badge" th:classappend="'text-bg-' + ${n['status_class']}"
                                          th:text="${n['status_display']}"></span>
                                    <span th:if="${n['lastError'] != null and !n['lastError'].isEmpty()}"
                                          class="text-muted small"
                                          th:title="${n['lastError']}"
                                          style="cursor: help;">?</span>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Notification Preferences card -->
            <div class="dms-card shadow-sm mt-4">
                <div class="card-body pt-0 pb-4">
                    <h4 class="card-title mt-3 mb-4 dms-card-title">Notification Preferences</h4>
                    <p class="text-muted">
                        Choose which topics you want to hear about. Notifications are delivered by email.
                    </p>

                    <form method="post"
                          th:action="'/profile/@' + ${preferred_username} + '/notifications'">
                        <div class="table-responsive">
                            <table class="table table-sm align-middle">
                                <thead>
                                <tr>
                                    <th scope="col">Topic</th>
                                    <th scope="col">Email</th>
                                    <th scope="col">Delivery</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="topic : ${preference_topics}">
                                    <td th:text="${topic['topicDisplayName']}"></td>
                                    <td>
                                        <!-- Round-trips the current override unchanged: the PUT this form
                                             drives treats a null/blank aggregation as "clear the override",
                                             so this field must always carry whatever value is currently
                                             stored - do not remove it even though there's no visible control
                                             for it (aggregation is read-only on this page). -->
                                        <input type="hidden" th:name="|aggregation_${topic['topic']}|"
                                               th:value="${topic['aggregationOverride']}">
                                        <input class="form-check-input" type="checkbox"
                                               th:name="|enabled_${topic['topic']}|" value="true"
                                               th:checked="${topic['enabled']}">
                                    </td>
                                    <td class="text-muted" th:text="${topic['effectiveAggregationDisplay']}"></td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                        <button type="submit" class="btn btn-sm btn-outline-primary">Save</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <th:block th:replace="~{fragments/toast :: toast}"></th:block>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<!-- Relative date component -->
<script type="module" src="/static/js/dms-relative-date.js"></script>
<!-- App JS -->
<script src="/static/js/app.js"></script>
<!-- Page Loader (REQUIRED for all pages) -->
<script src="/static/js/dms-page-loader.js" defer></script>
</body>
</html>
