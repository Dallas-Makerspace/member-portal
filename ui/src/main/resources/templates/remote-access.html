<!DOCTYPE html>
<html lang="en-US" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="initial-scale=1, width=device-width"/>

    <!-- PWA Meta Tags -->
    <th:block th:replace="~{fragments/pwa-meta :: pwa-meta}"></th:block>

    <link rel="stylesheet" href="/static/styles/global.css"/>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800;900&display=swap">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Remote Access - DMS Member Portal</title>
    <script>
        (function () {
            var id = new URLSearchParams(location.search).get('autolaunch');
            if (id) {
                history.replaceState(null, '', '/remote-access');
                location.href = '/remote-access/connect/' + encodeURIComponent(id);
            }
        })();
    </script>
    <style>
        /* Card redesign (see COMMIT: reverts cleanly if this doesn't land well) - reuses the same
           colored-left-border language already used for .category-header, so a card's status is
           readable at a glance without a loud filled badge competing with it. */
        .machine-card {
            transition: box-shadow 0.2s, border-color 0.2s;
            border: 1px solid rgba(0,0,0,.08);
            border-left-width: 4px;
            border-left-style: solid;
        }
        .machine-card:hover { box-shadow: 0 4px 12px rgba(0,0,0,.15) !important; }
        .machine-card-available { border-left-color: #198754; }
        .machine-card-inuse { border-left-color: #dc3545; }
        .machine-card-offline { border-left-color: #adb5bd; }

        .status-line { display: flex; align-items: center; gap: 0.4rem; font-weight: 600; font-size: 0.8125rem; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .status-dot-free { background-color: #198754; }
        .status-dot-inuse { background-color: #dc3545; }
        .status-dot-offline { background-color: #adb5bd; }
        .status-text-free { color: #146c43; }
        .status-text-inuse { color: #b02a37; }
        .status-text-offline { color: #6c757d; }

        .protocol-icon { font-size: 1.4rem; color: #6c757d; }
        .category-header { border-left: 4px solid #0b9cc9; padding-left: 0.75rem; }

        /* Occupant rows read as one grouped "who's on this machine" unit, distinct from the
           status/action area below it. */
        .occupant-list { background-color: #f8f9fa; border-radius: 6px; padding: 0.4rem 0.5rem; }
        .occupant-row { display: flex; align-items: center; gap: 0.5rem; }
        .occupant-row + .occupant-row { margin-top: 0.35rem; }
        .occupant-row dms-member-card { min-width: 0; flex-shrink: 1; overflow: hidden; }
        .occupant-row dms-relative-date { flex-shrink: 0; }
        .occupant-row .kill-btn { margin-left: auto; flex-shrink: 0; }
    </style>
</head>
<body>
<header class="top-nav" th:replace="~{fragments/header :: header}"></header>
<div class="container pb-5 mt-4">
    <div class="d-flex align-items-center gap-2 mb-1">
        <h1 class="mb-0">Remote Access</h1>
        <span id="refresh-indicator" class="d-none text-muted small d-flex align-items-center gap-1">
            <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
            Refreshing&hellip;
        </span>
    </div>
    <p class="text-muted mb-4">Connect to Dallas Makerspace virtual machines and workstations.</p>

    <div id="remote-access-categories" th:fragment="categoriesFragment">
        <div th:if="${categories == null || categories.isEmpty()}" class="alert alert-warning">
            No remote access categories are currently configured.
        </div>

        <div th:each="category : ${categories}" class="mb-5">
            <h2 class="category-header mb-1" th:text="${category.displayName}">Category</h2>
            <p class="text-muted mb-3" th:text="${category.description}"></p>

            <div th:if="${!category.userHasAccess}" class="alert alert-warning d-flex align-items-center mb-3">
                <span class="material-symbols-outlined me-2">lock</span>
                <span class="d-flex align-items-center flex-wrap gap-1">
                    Access requires membership in the
                    <dms-group-pill th:attr="name=${category.requiredAdGroup},slug=${category.requiredAdGroupSlug}"></dms-group-pill>
                    group.
                </span>
            </div>

            <div class="row g-3">
                <div th:each="machine : ${category.machines}" class="col-sm-6 col-md-4 col-lg-3">
                    <div class="card machine-card h-100 shadow-sm"
                         th:classappend="${machine.status == 'AVAILABLE' ? 'machine-card-available' : (machine.status == 'IN_USE' ? 'machine-card-inuse' : 'machine-card-offline')}">
                        <div class="card-body d-flex flex-column">
                            <div class="d-flex align-items-start mb-2">
                                <span class="material-symbols-outlined protocol-icon me-2"
                                      th:text="${machine.protocol == 'ssh' ? 'terminal' : 'desktop_windows'}">desktop_windows</span>
                                <h6 class="card-title mb-0 flex-grow-1" th:text="${machine.displayName}">Machine</h6>
                            </div>

                            <div class="status-line mb-2">
                                <span th:if="${machine.status == 'AVAILABLE'}" class="status-dot status-dot-free"></span>
                                <span th:if="${machine.status == 'IN_USE'}" class="status-dot status-dot-inuse"></span>
                                <span th:if="${machine.status == 'OFFLINE'}" class="status-dot status-dot-offline"></span>
                                <span th:if="${machine.status == 'AVAILABLE'}" class="status-text-free">Available</span>
                                <span th:if="${machine.status == 'IN_USE'}" class="status-text-inuse">Full</span>
                                <span th:if="${machine.status == 'OFFLINE'}" class="status-text-offline">Offline</span>
                            </div>

                            <!-- Current occupant(s) - both Guacamole-routed and direct/bypass RDP
                                 sessions detected via WinRM, rendered identically (same member card,
                                 same relative timestamp) since there's nothing route-specific for a
                                 member to care about here. Only rendered when someone is actually
                                 connected, so an unoccupied machine looks exactly as simple as before.
                                 A session only gets a kill button when it has a Guacamole
                                 activeConnectionId to kill by - a direct/bypass session detected via
                                 WinRM alone has none. -->
                            <div th:if="${!machine.sessions.isEmpty()}" class="occupant-list mb-3 small">
                                <div th:each="sess : ${machine.sessions}" class="occupant-row">
                                    <dms-member-card th:attr="username=${sess.username}" state="mini"></dms-member-card>
                                    <dms-relative-date th:attr="timestamp=${sess.sessionStartDisplay}"
                                                        elapsed
                                                        class="text-muted"></dms-relative-date>
                                    <button th:if="${canKillConnections && sess.activeConnectionId != null}"
                                            th:data-active-connection-id="${sess.activeConnectionId}"
                                            th:data-occupant="${sess.username}"
                                            class="btn btn-outline-danger btn-sm kill-btn"
                                            title="Kill this session">
                                        <span class="material-symbols-outlined" style="font-size:1rem;vertical-align:middle">power_off</span>
                                    </button>
                                </div>
                            </div>

                            <div class="mt-auto">
                                <!-- Offline -->
                                <button th:if="${machine.status == 'OFFLINE'}"
                                        class="btn btn-outline-secondary btn-sm w-100" disabled>
                                    <span class="material-symbols-outlined" style="font-size:1rem;vertical-align:middle">cloud_off</span>
                                    Offline
                                </button>
                                <!-- Connectable and user has access (may already have occupants if the
                                     machine supports multiple concurrent logins). Relabeled
                                     "Reconnect" when this would resume the user's own Disconnected
                                     session rather than start a brand new one - see
                                     RemoteAccessHandler.buildMachineViewModel. -->
                                <a th:if="${category.userHasAccess && machine.status != 'OFFLINE' && machine.userCanConnect}"
                                   th:href="'/remote-access/connect/' + ${machine.connectionId}"
                                   target="_blank"
                                   class="btn btn-primary btn-sm w-100 remote-access-connect-btn">
                                    <span class="material-symbols-outlined" style="font-size:1rem;vertical-align:middle">login</span>
                                    <span th:text="${machine.resumingOwnSession} ? 'Reconnect' : 'Connect'">Connect</span>
                                </a>
                                <!-- Full - danger-tinted (rather than the same gray as Offline) so it
                                     visually ties back to the red status dot/border instead of reading
                                     the same as "unreachable". -->
                                <button th:if="${machine.status == 'IN_USE'}"
                                        class="btn btn-outline-danger btn-sm w-100" disabled>Full</button>
                                <!-- Has access but at their personal session limit (machine itself
                                     still has room, hence not IN_USE) -->
                                <button th:if="${category.userHasAccess && machine.status == 'AVAILABLE' && !machine.userCanConnect}"
                                        class="btn btn-outline-secondary btn-sm w-100" disabled>
                                    Already Connected
                                </button>
                                <!-- No access - the reason is shown as visible text below the button,
                                     not just a hover title, so it's legible on touch devices too. -->
                                <button th:if="${!category.userHasAccess && machine.status == 'AVAILABLE'}"
                                        class="btn btn-outline-secondary btn-sm w-100" disabled>
                                    <span class="material-symbols-outlined" style="font-size:1rem;vertical-align:middle">lock</span>
                                    Connect
                                </button>
                                <div th:if="${!category.userHasAccess && machine.status == 'AVAILABLE'}"
                                     class="small text-muted text-center mt-1"
                                     th:text="'Requires: ' + ${category.requiredAdGroup}"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<!-- App JS -->
<script src="/static/js/app.js"></script>
<!-- Page Loader (REQUIRED for all pages) -->
<script src="/static/js/dms-page-loader.js" defer></script>
<!-- Member card + relative date, used to render current occupant(s); group pill for locked-category access group -->
<script type="module" src="/static/js/dms-member-card.js"></script>
<script type="module" src="/static/js/dms-relative-date.js"></script>
<script type="module" src="/static/js/dms-group-pill.js"></script>
<script>
    // Refresh machine/session state when the user returns to this tab (e.g. after a Guacamole
    // session), without a full page reload. The container is swapped via outerHTML, so listeners
    // are attached via delegation on a stable ancestor rather than re-wired after every refresh.
    var lastLoad = Date.now();
    var refreshIndicator = document.getElementById('refresh-indicator');
    var refreshInFlight = false;

    // Status checks (TCP + WinRM) can take a couple of seconds, so Connect is disabled for the
    // duration of a refresh to avoid clicking into a machine whose displayed state is stale.
    function setConnectButtonsDisabled(disabled) {
        document.querySelectorAll('.remote-access-connect-btn').forEach(function (btn) {
            btn.classList.toggle('disabled', disabled);
            btn.setAttribute('aria-disabled', disabled ? 'true' : 'false');
        });
    }

    function refreshCategories() {
        if (refreshInFlight) return;
        refreshInFlight = true;
        refreshIndicator.classList.remove('d-none');
        setConnectButtonsDisabled(true);
        fetch('/remote-access/refresh', {credentials: 'same-origin'})
            .then(function (r) {
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.text();
            })
            .then(function (html) {
                // Fresh, already-enabled buttons come in with the new HTML - no need to re-enable.
                document.getElementById('remote-access-categories').outerHTML = html;
                lastLoad = Date.now();
            })
            .catch(function (e) {
                console.warn('Failed to refresh Remote Access state', e);
                // The DOM was NOT replaced on failure, so buttons disabled above would otherwise
                // stay stuck disabled indefinitely - re-enable them explicitly here.
                setConnectButtonsDisabled(false);
            })
            .finally(function () {
                refreshIndicator.classList.add('d-none');
                refreshInFlight = false;
            });
    }

    document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible' && Date.now() - lastLoad > 2000) {
            refreshCategories();
        }
    });

    document.addEventListener('click', function (e) {
        // Bootstrap's .btn.disabled already blocks pointer clicks (pointer-events: none), but not
        // keyboard Enter/Space activation of a focused <a> - guard that here too.
        var connectBtn = e.target.closest('a.remote-access-connect-btn.disabled');
        if (connectBtn) {
            e.preventDefault();
            return;
        }
        var btn = e.target.closest('.kill-btn');
        if (!btn) return;
        var id = btn.dataset.activeConnectionId;
        var who = btn.dataset.occupant || 'this user';
        if (!confirm('Force disconnect ' + who + ' from this machine?')) return;
        btn.disabled = true;
        fetch('/remote-access/disconnect/' + id, {method: 'POST', credentials: 'same-origin'})
            .then(function () { refreshCategories(); })
            .catch(function (e) { alert('Failed: ' + e); btn.disabled = false; });
    });
</script>
</body>
</html>
