<!DOCTYPE html>
<html lang="en-US" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="initial-scale=1, width=device-width"/>

    <!-- PWA Meta Tags -->
    <th:block th:replace="~{fragments/pwa-meta :: pwa-meta}"></th:block>

    <link rel="stylesheet" href="/static/styles/global.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800;900&display=swap">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0&display=swap"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title th:text="'Follows - @' + ${preferred_username}"></title>
</head>
<body>
<header class="top-nav" th:replace="~{fragments/header :: header}"></header>
<div class="container pb-8">
    <div class="row">
        <div class="col-md-10 col-lg-9 mx-auto">
            <!-- Back to profile link -->
            <div class="mt-4">
                <a th:href="'/profile/@' + ${preferred_username}" class="text-decoration-none">
                    <span class="material-symbols-outlined align-middle" style="font-size:18px;">arrow_back</span>
                    Back to profile
                </a>
            </div>

            <div class="dms-card shadow-sm mt-3">
                <div class="card-body">
                    <h4 class="card-title mt-3 mb-3 dms-card-title"
                        th:text="${is_self} ? 'Your follows' : 'Follows for @' + ${preferred_username}"></h4>
                    <ul class="nav nav-tabs mb-3" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" id="following-tab" data-bs-toggle="tab"
                                    data-bs-target="#following" type="button" role="tab"
                                    aria-controls="following" aria-selected="true">
                                Following
                                <span class="badge bg-primary ms-1" th:text="${#lists.size(following)}"></span>
                            </button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="followers-tab" data-bs-toggle="tab"
                                    data-bs-target="#followers" type="button" role="tab"
                                    aria-controls="followers" aria-selected="false">
                                Followers
                                <span class="badge bg-secondary ms-1" th:text="${#lists.size(followers)}"></span>
                            </button>
                        </li>
                    </ul>
                    <div class="tab-content">
                        <div class="tab-pane fade show active" id="following" role="tabpanel"
                             aria-labelledby="following-tab">
                            <div th:if="${#lists.isEmpty(following)}" class="text-muted py-2">
                                <span th:if="${is_self}">You aren't following anyone yet. Follow a member from their profile to get notified when they post an event or a project.</span>
                                <span th:unless="${is_self}">@<span th:text="${preferred_username}"></span> isn't following anyone yet.</span>
                            </div>
                            <th:block th:unless="${#lists.isEmpty(following)}">
                                <div th:replace="~{fragments/member-grid :: member-grid(${following}, false, null)}"></div>
                            </th:block>
                        </div>
                        <div class="tab-pane fade" id="followers" role="tabpanel" aria-labelledby="followers-tab">
                            <div th:if="${#lists.isEmpty(followers)}" class="text-muted py-2">
                                <span th:if="${is_self}">No one is following you yet.</span>
                                <span th:unless="${is_self}">No one follows @<span th:text="${preferred_username}"></span> yet.</span>
                            </div>
                            <th:block th:unless="${#lists.isEmpty(followers)}">
                                <div th:replace="~{fragments/member-grid :: member-grid(${followers}, false, null)}"></div>
                            </th:block>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<!-- App JS -->
<script src="/static/js/app.js"></script>
<!-- Page Loader (REQUIRED for all pages) -->
<script src="/static/js/dms-page-loader.js" defer></script>
<script type="module" src="/static/js/dms-member-card.js"></script>
<style>
.dms-card .nav-tabs .nav-link { color: #6c757d; }
.dms-card .nav-tabs .nav-link.active { color: #0b9cc9; }
</style>
<script>
    // Deep links (/follows#followers) open the matching tab, and switching tabs updates the hash.
    (function () {
        const tabFor = { '#following': 'following-tab', '#followers': 'followers-tab' };
        const initial = tabFor[window.location.hash];
        if (initial) bootstrap.Tab.getOrCreateInstance(document.getElementById(initial)).show();
        document.querySelectorAll('[data-bs-toggle="tab"]').forEach(function (btn) {
            btn.addEventListener('shown.bs.tab', function () {
                history.replaceState(null, '', btn.getAttribute('data-bs-target'));
            });
        });
    })();
</script>
</body>
</html>
