<!DOCTYPE html>
<html lang="en-US" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="initial-scale=1, width=device-width"/>

    <!-- PWA Meta Tags -->
    <th:block th:replace="~{fragments/pwa-meta :: pwa-meta}"></th:block>

    <link rel="stylesheet" href="/static/styles/global.css"/>
    <link rel="stylesheet" href="/static/styles/profile.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800;900&display=swap">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title th:text="'Committee: ' + ${committee.name}"></title>
    <style>
        .group-pills-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .section-label {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #6c757d;
            font-size: 0.875rem;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .section-label .material-symbols-outlined {
            font-size: 16px;
            line-height: 1;
        }
    </style>
</head>
<body>
<header class="top-nav" th:replace="~{fragments/header :: header}"></header>
<div class="container pb-8">
    <div class="row">
        <div class="col-md-4">
            <!-- Committee info card -->
            <div class="card shadow-sm overflow-hidden mt-4">
                <div class="card-body">
                    <h2 class="card-title mb-3" th:text="${committee.name}"></h2>
                    <div th:if="${committee.description}" class="card-text">
                        <span th:text="${committee.description}"></span>
                    </div>
                    <div th:if="${committee.homepageUrl}" class="mt-3">
                        <a th:href="${committee.homepageUrl}" target="_blank"
                           class="text-decoration-none text-muted small"
                           data-track-action="committee-source-page-click" th:attr="data-track-label=${committee.slug}">
                            <span class="material-symbols-outlined" style="font-size: 14px; vertical-align: middle;">open_in_new</span>
                            Committee Source Page
                        </a>
                    </div>
                </div>
            </div>

            <!-- Chairpersons card -->
            <div class="card shadow-sm overflow-hidden mt-4">
                <div class="card-body">
                    <h5 class="card-title mb-3">Chair<span
                            th:if="${chairpersons != null and #lists.size(chairpersons) > 1}">s</span></h5>
                    <div class="card-text">
                        <div th:if="${chairpersons != null and !chairpersons.empty}">
                            <div th:each="chair : ${chairpersons}" class="mb-2">
                                <dms-member-card
                                        th:attr="username=${chair.username}"
                                        state="mini">
                                </dms-member-card>
                            </div>
                        </div>
                        <span th:if="${chairpersons == null or chairpersons.empty}"
                              class="text-muted small">No chairperson assigned</span>
                    </div>
                </div>
            </div>

            <!-- Teacher Groups card -->
            <div class="card shadow-sm overflow-hidden mt-4" th:if="${teacherGroups != null and !teacherGroups.empty}">
                <div class="card-body">
                    <h5 class="card-title mb-3">Teachers</h5>
                    <div class="card-text">
                        <div th:each="group, iterStat : ${teacherGroups}"
                             th:class="${iterStat.last ? '' : 'mb-4 pb-4 border-bottom'}">
                            <div class="mb-2">
                                <dms-group-pill th:attr="name=${group.name},slug=${group.slug}"></dms-group-pill>
                            </div>
                            <div th:if="${group.members != null and !group.members.empty}">
                                <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px;">
                                    <div th:each="member, memberStat : ${group.members}"
                                         th:if="${memberStat.index < 6}">
                                        <dms-member-card
                                                th:attr="username=${member.username}"
                                                state="mini">
                                        </dms-member-card>
                                    </div>
                                </div>
                                <div th:if="${#lists.size(group.members) > 6}" class="mt-2 text-muted small text-end">
                                    and <a th:href="'/groups/' + ${group.slug}" class="text-muted"><span th:text="${#lists.size(group.members) - 6}"></span> more...</a>
                                </div>
                            </div>
                            <span th:if="${group.members == null or group.members.empty}"
                                  class="text-muted small">No teachers assigned</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-8">
            <!-- Committee-specific contributed sections (e.g. Bambu printer status for 3D Fab) -
                 generic over whatever CommitteePageSectionProvider beans applied to this committee;
                 this template never names a specific committee or feature. -->
            <div th:each="section : ${sections}" th:with="sectionModel=${section.model}" class="mt-4">
                <div th:insert="~{${section.fragmentName} :: content}"></div>
            </div>

            <!-- Upcoming Classes card -->
            <div class="dms-card shadow-sm mt-4">
                <div class="card-body">
                    <h4 class="card-title mt-3 mb-4 dms-card-title">Upcoming Classes</h4>
                    <div class="card-text">
                        <div th:if="${upcomingEvents != null and !upcomingEvents.empty}">
                            <div class="d-flex flex-column gap-3">
                                <div th:each="event, eventStat : ${upcomingEvents}"
                                     th:if="${eventStat.index < 5}"
                                     class="d-flex align-items-start gap-3">
                                    <span class="material-symbols-outlined text-muted"
                                          style="font-size: 24px;">event</span>
                                    <div class="flex-grow-1">
                                        <div class="d-flex justify-content-between align-items-start">
                                            <a th:href="'https://calendar.dallasmakerspace.org/events/view/' + ${event.id}"
                                               target="_blank"
                                               class="text-decoration-none text-dark fw-semibold"
                                               th:text="${event.name}"></a>
                                            <a th:href="'https://calendar.dallasmakerspace.org/events/view/' + ${event.id}"
                                               target="_blank"
                                               class="text-decoration-none ms-2">
                                                <span class="material-symbols-outlined" style="font-size: 18px;">open_in_new</span>
                                            </a>
                                        </div>
                                        <div class="text-muted small mt-1">
                                            <dms-relative-date
                                                    th:attr="timestamp=${event.eventStart}"></dms-relative-date>
                                        </div>
                                        <div th:if="${event.organizer != null and event.organizer.username != null and event.organizer.username != ''}"
                                             class="d-flex align-items-center gap-2 mt-2">
                                            <small class="text-muted">Teacher:</small>
                                            <dms-member-card
                                                    th:attr="username=${event.organizer.username}"
                                                    state="mini">
                                            </dms-member-card>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div th:if="${#lists.size(upcomingEvents) > 5}" class="mt-3">
                                <a href="https://calendar.dallasmakerspace.org/events" target="_blank"
                                   class="btn btn-sm btn-outline-primary">
                                    Show More (<span th:text="${#lists.size(upcomingEvents) - 5}"></span> more)
                                </a>
                            </div>
                        </div>
                        <div th:if="${upcomingEvents == null or upcomingEvents.empty}" class="text-muted">
                            No upcoming classes scheduled for this committee.
                        </div>
                    </div>
                </div>
            </div>

            <!-- Committee Groups card -->
            <div class="dms-card shadow-sm mt-4">
                <div class="card-body">
                    <h4 class="card-title mt-3 mb-4 dms-card-title">
                        Committee Groups
                    </h4>
                    <div class="card-text">
                        <div th:if="${committeeGroups != null and !committeeGroups.empty}"
                             class="group-pills-container">
                            <dms-group-pill th:each="group : ${committeeGroups}"
                                            th:attr="name=${group.name},slug=${group.slug}">
                            </dms-group-pill>
                        </div>
                        <div th:if="${committeeGroups == null or committeeGroups.empty}" class="text-muted">
                            No groups found for this committee.
                        </div>
                        <div th:if="${archivedGroupsUrl != null}" class="mt-3">
                            <a th:href="${archivedGroupsUrl}" class="btn btn-sm btn-outline-secondary"
                               id="archived-groups-button">
                                Archived Groups (<span th:text="${archivedGroupsCount}"></span>)
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<!-- App JS -->
<script src="/static/js/app.js"></script>
<!-- Page Loader (REQUIRED for all pages) -->
<script src="/static/js/dms-page-loader.js" defer></script>
<script type="module" src="/static/js/dms-member-card.js"></script>
<script type="module" src="/static/js/dms-group-pill.js"></script>
<script type="module" src="/static/js/dms-relative-date.js"></script>
</body>
</html>
