<!DOCTYPE html>
<html lang="en-US" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="initial-scale=1, width=device-width"/>
    <th:block th:replace="~{fragments/pwa-meta :: pwa-meta}"></th:block>
    <link rel="stylesheet" href="/static/styles/global.css"/>
    <link rel="stylesheet" href="/static/styles/profile.css"/>
    <link rel="stylesheet" href="/static/styles/workflows.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800;900&display=swap">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Workflows in progress — DMS Member Portal</title>
</head>
<body>
<header class="top-nav" th:replace="~{fragments/header :: header}"></header>

<div class="container pb-8" id="wf-admin-root">
    <div class="d-flex flex-wrap justify-content-between align-items-end mt-4 mb-3 gap-2">
        <div>
            <h1 class="mb-1">Workflows in progress</h1>
            <p class="text-muted mb-0">Check here before restarting or deploying the member portal service.</p>
        </div>
        <div class="text-end">
            <div id="wf-admin-conn"></div>
            <div class="small text-muted" id="wf-admin-generated"></div>
        </div>
    </div>

    <div id="wf-admin-message"></div>
    <div id="wf-admin-banner" class="alert alert-secondary mb-3" role="status">
        <div class="fw-bold fs-5">Loading&hellip;</div>
    </div>

    <div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead>
            <tr>
                <th scope="col">Workflow</th>
                <th scope="col">Subject</th>
                <th scope="col">Started by</th>
                <th scope="col">Status</th>
                <th scope="col">Current step</th>
                <th scope="col">Started</th>
                <th scope="col">Held by instance</th>
                <th scope="col">Lease age</th>
                <th scope="col"><span class="visually-hidden">Actions</span></th>
            </tr>
            </thead>
            <tbody id="wf-admin-rows"></tbody>
        </table>
    </div>
    <p id="wf-admin-empty" class="text-muted" hidden>No workflows are running, waiting or paused.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<script src="/static/js/app.js"></script>
<script src="/static/js/dms-page-loader.js" defer></script>
<script src="/static/js/workflow-common.js"></script>
<script src="/static/js/workflow-admin.js"></script>
</body>
</html>
