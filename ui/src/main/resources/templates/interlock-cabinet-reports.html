<!DOCTYPE html>
<html lang="en-US" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="initial-scale=1, width=device-width"/>
    <th:block th:replace="~{fragments/pwa-meta :: pwa-meta}"></th:block>
    <link rel="stylesheet" href="/static/styles/global.css"/>
    <link rel="stylesheet" href="/static/styles/profile.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800;900&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title th:if="${reportSlug == null}" th:text="${cabinetName} + ' Reports - DMS Member Portal'">Cabinet Reports - DMS Member Portal</title>
    <title th:if="${reportSlug != null}" th:text="${cabinetName} + ' — ' + ${reportName} + ' - DMS Member Portal'">Cabinet Report - DMS Member Portal</title>
</head>
<body>
<header class="top-nav" th:replace="~{fragments/header :: header}"></header>
<div class="container-fluid container-lg pb-5 px-3 px-lg-4">
    <div class="row mt-4 mb-3">
        <div class="col-12">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="/interlock-cabinets">Interlock Cabinets</a></li>
                    <li class="breadcrumb-item">
                        <a th:href="'/interlock-cabinets?cabinet=' + ${cabinetTag}" th:text="${cabinetName}"></a>
                    </li>
                    <li class="breadcrumb-item" th:if="${reportSlug != null}">
                        <a th:href="'/interlock-cabinets?cabinet=' + ${cabinetTag} + '&view=reports'">Reports</a>
                    </li>
                    <li class="breadcrumb-item active" th:if="${reportSlug == null}">Reports</li>
                    <li class="breadcrumb-item active" th:if="${reportSlug != null}" th:text="${reportName}"></li>
                </ol>
            </nav>
            <h1 class="mb-1" th:if="${reportSlug == null}" th:text="${cabinetName} + ' Reports'">Cabinet Reports</h1>
            <h1 class="mb-1" th:if="${reportSlug != null}" th:text="${reportName}">Report Name</h1>
            <p class="text-muted mb-0">
                <a th:href="'/committees/' + ${committeeSlug}" class="text-decoration-none"
                   th:text="${committeeName} + ' Committee'"></a>
            </p>
        </div>
    </div>

    <!-- Report index (card grid) -->
    <div th:if="${reportSlug == null}" class="row g-3 mt-3">
        <div th:each="r : ${reports}" class="col-md-6 col-lg-4">
            <a th:href="'/interlock-cabinets?cabinet=' + ${cabinetTag} + '&report=' + ${r.slug}"
               class="card shadow-sm h-100 text-decoration-none text-reset">
                <div class="card-body">
                    <h5 class="card-title mb-2" th:text="${r.name}">Report name</h5>
                    <p class="text-muted small mb-0" th:text="${r.description}">Description</p>
                </div>
            </a>
        </div>
    </div>

    <!-- Single report viewer -->
    <div th:if="${reportSlug != null}" class="mt-3">
        <p class="text-muted" th:if="${reportDescription}" th:text="${reportDescription}"></p>

        <!-- Heatmap: two stacked charts (hour, then day-of-week) -->
        <th:block th:if="${reportSlug == 'usage-heatmap'}">
            <h5 class="mt-3 mb-2">By hour of day</h5>
            <dms-data-visualizer
                    th:attr="dataUrl='/backend-api/data-viz/' + ${dataVizName} + '?cabinet=' + ${cabinetTag} + '&days=' + ${defaultDays} + '&aggregateBy=hour',
                             renderAs=${renderAs}"
                    filterable="true"></dms-data-visualizer>
            <h5 class="mt-4 mb-2">By day of week</h5>
            <dms-data-visualizer
                    th:attr="dataUrl='/backend-api/data-viz/' + ${dataVizName} + '?cabinet=' + ${cabinetTag} + '&days=' + ${defaultDays} + '&aggregateBy=dayOfWeek',
                             renderAs=${renderAs}"
                    filterable="true"></dms-data-visualizer>
        </th:block>

        <!-- Default: single visualizer -->
        <dms-data-visualizer
                th:if="${reportSlug != 'usage-heatmap'}"
                th:attr="dataUrl='/backend-api/data-viz/' + ${dataVizName} + '?cabinet=' + ${cabinetTag} + '&days=' + ${defaultDays},
                         renderAs=${renderAs}"
                filterable="true"></dms-data-visualizer>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
<script src="/static/js/app.js"></script>
<script src="/static/js/dms-page-loader.js" defer></script>
<script type="module" src="/static/js/dms-data-visualizer.js"></script>
<script type="module" src="/static/js/dms-group-pill.js"></script>
<script type="module" src="/static/js/dms-relative-date.js"></script>
<script type="module" src="/static/js/dms-member-card.js"></script>
</body>
</html>
