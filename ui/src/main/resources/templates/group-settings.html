<!DOCTYPE html>
<html lang="en-US" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="initial-scale=1, width=device-width"/>

    <!-- PWA Meta Tags -->
    <th:block th:replace="~{fragments/pwa-meta :: pwa-meta}"></th:block>

    <link rel="stylesheet" href="/static/styles/global.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800;900&display=swap">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0&display=swap"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title th:text="'Settings - ' + ${name}"></title>
</head>
<body>
<header class="top-nav" th:replace="~{fragments/header :: header}"></header>
<div class="container pb-8">
    <div class="row">
        <div class="col-md-8 col-lg-6 mx-auto">
            <!-- Back to group link -->
            <div class="mt-4">
                <a th:href="'/groups/' + ${slug}" class="text-decoration-none">
                    <span class="material-symbols-outlined align-middle" style="font-size:18px;">arrow_back</span>
                    Back to <span th:text="${name}"></span>
                </a>
            </div>

            <!-- Group Settings card -->
            <div class="dms-card shadow-sm mt-3">
                <div class="card-body pt-0 pb-4">
                    <h4 class="card-title mt-3 mb-1 dms-card-title">Group Settings</h4>
                    <p class="text-muted">
                        These settings are not yet enforced anywhere in the portal — they are
                        stored here in preparation for future features that will read them.
                    </p>

                    <form method="post" th:action="'/groups/' + ${slug} + '/settings'">
                        <div class="form-check form-switch mb-3" th:each="meta : ${settings_meta}">
                            <input class="form-check-input" type="checkbox" role="switch"
                                   th:id="${meta['key']}" th:name="${meta['key']}"
                                   th:checked="${meta['enabled']}">
                            <label class="form-check-label" th:for="${meta['key']}"
                                   th:text="${meta['label']}"></label>
                            <div class="form-text" th:text="${meta['description']}"></div>
                        </div>
                        <button type="submit" class="btn btn-primary">Save</button>
                    </form>
                </div>
            </div>

            <!-- Settings History card -->
            <div class="dms-card shadow-sm mt-4"
                 th:if="${settings_history != null and !settings_history.empty}">
                <div class="card-body pt-0 pb-4">
                    <div class="d-flex align-items-center mt-3" style="cursor:pointer;"
                         data-bs-toggle="collapse" data-bs-target="#settingsHistoryContent"
                         aria-expanded="false" aria-controls="settingsHistoryContent">
                        <h4 class="card-title mb-0 dms-card-title">Settings History</h4>
                        <span class="material-symbols-outlined ms-auto text-muted"
                              id="settingsHistoryToggleIcon">expand_more</span>
                    </div>
                    <div class="collapse" id="settingsHistoryContent">
                    <div class="table-responsive mt-3">
                        <table class="table table-sm">
                            <thead>
                            <tr>
                                <th scope="col">When</th>
                                <th scope="col">Change</th>
                                <th scope="col">Updated by</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="entry : ${settings_history}">
                                <td>
                                    <dms-relative-date
                                            th:attr="timestamp=${entry['updated_at']}"></dms-relative-date>
                                </td>
                                <td>
                                    <div class="text-muted" th:each="meta : ${settings_meta}"
                                         th:if="${meta['key'] == entry['setting_key']}"
                                         th:text="${meta['label']} + ':'"></div>
                                    <span th:if="${entry['setting_value'] == 'true'}">Enabled</span>
                                    <span th:if="${entry['setting_value'] == 'false'}">Disabled</span>
                                    <span th:if="${entry['setting_value'] == null}"
                                          class="text-muted">Cleared</span>
                                </td>
                                <td>
                                    <th:block th:if="${entry['updated_by'] != null and !entry['updated_by'].isEmpty()}">
                                        <dms-member-card
                                                th:attr="username=${entry['updated_by']}"
                                                state="mini">
                                        </dms-member-card>
                                    </th:block>
                                    <span th:if="${entry['updated_by'] == null or entry['updated_by'].isEmpty()}"
                                          class="text-muted">Unknown</span>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                    </div><!-- end collapse -->
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Toast for success messages -->
    <div th:if="${toast_message}"
         id="liveToast"
         class="toast align-items-center text-bg-success border-0 show"
         role="alert"
         aria-live="assertive"
         aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body" th:text="|${toast_message}|"></div>
            <button
                    type="button"
                    class="btn-close btn-close-white me-2 m-auto"
                    data-bs-dismiss="toast"
                    aria-label="Close"></button>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<!-- Relative date component -->
<script type="module" src="/static/js/dms-relative-date.js"></script>
<!-- Member card component -->
<script type="module" src="/static/js/dms-member-card.js"></script>
<!-- App JS -->
<script src="/static/js/app.js"></script>
<!-- Page Loader (REQUIRED for all pages) -->
<script src="/static/js/dms-page-loader.js" defer></script>

<!-- Settings history collapse icon toggle -->
<script>
    (function() {
        'use strict';
        const historyToggle = document.getElementById('settingsHistoryContent');
        const historyIcon = document.getElementById('settingsHistoryToggleIcon');
        if (historyToggle && historyIcon) {
            historyToggle.addEventListener('show.bs.collapse', function() {
                historyIcon.textContent = 'expand_less';
            });
            historyToggle.addEventListener('hide.bs.collapse', function() {
                historyIcon.textContent = 'expand_more';
            });
        }
    })();
</script>
</body>
</html>
