<!DOCTYPE html>
<html lang="en-US" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="initial-scale=1, width=device-width"/>
    <th:block th:replace="~{fragments/pwa-meta :: pwa-meta}"></th:block>
    <link rel="stylesheet" href="/static/styles/global.css"/>
    <link rel="stylesheet" href="/static/styles/profile.css"/>
    <link rel="stylesheet" href="/static/styles/workflows.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800;900&display=swap">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Workflow run — DMS Member Portal</title>
</head>
<body>
<header class="top-nav" th:replace="~{fragments/header :: header}"></header>

<div class="container pb-8" id="wf-run-root" th:attr="data-run-id=${runId},data-can-operate=${canOperate}">
    <nav aria-label="breadcrumb" class="mt-4">
        <ol class="breadcrumb mb-2">
            <li class="breadcrumb-item" th:if="${isInfraUser}"><a href="/admin/workflows">Workflows</a></li>
            <li class="breadcrumb-item active" aria-current="page" th:text="'Run #' + ${runId}">Run</li>
        </ol>
    </nav>
    <div class="d-flex flex-wrap justify-content-between align-items-end mb-3 gap-2">
        <h1 class="mb-0" th:text="${runTitle}">Workflow run</h1>
        <div id="wf-run-conn"></div>
    </div>

    <div id="wf-run-message"></div>
    <div id="wf-run-header" class="card card-body mb-3">
        <div class="text-muted">Loading&hellip;</div>
    </div>
    <div id="wf-run-actions" class="mb-2"></div>

    <h2 class="h5 mt-3 mb-3">Steps</h2>
    <div id="wf-run-timeline" class="mb-4"></div>
    <div id="wf-run-log" class="mb-4"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<script src="/static/js/app.js"></script>
<script src="/static/js/dms-page-loader.js" defer></script>
<script src="/static/js/workflow-common.js"></script>
<script src="/static/js/workflow-run.js"></script>
</body>
</html>
