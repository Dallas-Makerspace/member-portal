<!DOCTYPE html>
<html lang="en-US" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="initial-scale=1, width=device-width"/>
    <th:block th:replace="~{fragments/pwa-meta :: pwa-meta}"></th:block>
    <link rel="stylesheet" href="/static/styles/global.css"/>
    <link rel="stylesheet" href="/static/styles/profile.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800;900&display=swap">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Interlock Tools - DMS Member Portal</title>
</head>
<body>
<header class="top-nav" th:replace="~{fragments/header :: header}"></header>
<div class="container-fluid container-lg pb-5 px-3 px-lg-4">
    <div class="row">
        <div class="col-12">
            <h1 class="mt-4 mb-2">Interlock Tools <span class="badge bg-warning text-dark" style="font-size:0.55em;vertical-align:middle">Beta</span></h1>
            <p class="text-muted mb-4">Tools managed by the RFID interlock system, grouped by committee</p>
        </div>
    </div>

    <div th:each="group : ${toolsByCommittee}" class="mb-5">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="mb-0">
                <a th:href="'/committees/' + ${group.committeeSlug}" class="text-decoration-none"
                   th:text="${group.committeeName} + ' Committee'"></a>
            </h4>
            <a th:href="'/interlock-tools?committee=' + ${group.committeeSlug} + '&view=reports'"
               class="btn btn-sm btn-outline-secondary">View Reports</a>
        </div>
        <div class="card shadow-sm">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>Tool</th>
                    <th class="d-none d-md-table-cell">Prerequisite Group</th>
                    <th class="d-none d-md-table-cell">Timeout</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="tool : ${group.tools}">
                    <td>
                        <div th:text="${tool.name}"></div>
                        <div class="d-md-none mt-1" th:if="${tool.prerequisiteGroup != null}">
                            <dms-group-pill th:attr="name=${tool.prerequisiteGroup},slug=${tool.prerequisiteGroupSlug}">
                            </dms-group-pill>
                        </div>
                    </td>
                    <td class="d-none d-md-table-cell">
                        <dms-group-pill th:if="${tool.prerequisiteGroup != null}"
                                        th:attr="name=${tool.prerequisiteGroup},slug=${tool.prerequisiteGroupSlug}">
                        </dms-group-pill>
                    </td>
                    <td class="d-none d-md-table-cell" th:text="${tool.timeoutSeconds} + 's'"></td>
                    <td class="text-end">
                        <div class="d-grid d-sm-inline-flex gap-1" role="group">
                            <a th:href="'/interlock-tools?tool=' + ${tool.interlockTag}"
                               class="btn btn-sm btn-outline-primary text-nowrap">View Usage</a>
                            <a th:href="'/interlock-tools?tool=' + ${tool.interlockTag} + '&view=reports'"
                               class="btn btn-sm btn-outline-secondary text-nowrap">View Reports</a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<script src="/static/js/app.js"></script>
<script src="/static/js/dms-page-loader.js" defer></script>
<script type="module" src="/static/js/dms-group-pill.js"></script>
</body>
</html>
