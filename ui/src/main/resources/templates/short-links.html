<!DOCTYPE html>
<html lang="en-US" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="initial-scale=1, width=device-width"/>
    <title>Short Links - DMS Member Portal</title>

    <!-- PWA Meta Tags -->
    <th:block th:replace="~{fragments/pwa-meta :: pwa-meta}"></th:block>

    <link rel="stylesheet" href="/static/styles/global.css"/>
    <link rel="stylesheet" href="/static/styles/profile.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800;900&display=swap">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        .short-link-card {
            transition: all 0.3s ease;
        }
        .short-link-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1) !important;
        }
        .click-count {
            background-color: #e9ecef;
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 0.85rem;
            font-weight: 500;
            display: inline-block;
        }
        .link-path {
            color: #0d6efd;
            font-weight: 500;
            font-family: monospace;
            word-break: break-all;
        }
        .short-links-table td {
            vertical-align: middle;
        }
        .short-links-table tr:hover {
            background-color: rgba(0, 0, 0, 0.04);
        }
        .rank-badge {
            background-color: #f8f9fa;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: #495057;
        }
    </style>
</head>
<body>
<header class="top-nav" th:replace="~{fragments/header :: header}"></header>
<div class="container pb-8">
    <div class="row">
        <div class="col-12">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="mt-4 mb-2">Popular Short Links</h1>
                    <p class="text-muted">Discover the most-used Dallas Makerspace branded short URLs</p>
                </div>
                <div th:if="${authz.can('MANAGE_SHORTLINKS')}">
                    <a th:if="${is_development_mode}" href="/short-links/admin" class="btn btn-primary">
                        <span class="material-symbols-outlined" style="font-size: 20px; vertical-align: middle; margin-right: 5px;">settings</span>
                        Manage Links
                    </a>
                    <button th:unless="${is_development_mode}" class="btn btn-primary" disabled
                            title="Link management is currently in development and only available in development mode">
                        <span class="material-symbols-outlined" style="font-size: 20px; vertical-align: middle; margin-right: 5px;">settings</span>
                        Manage Links
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Desktop Table View (lg and up) -->
    <div class="d-none d-lg-block">
        <div class="card shadow-sm">
            <table class="table table-hover short-links-table mb-0">
                <thead class="table-light">
                    <tr>
                        <th style="width: 5%">#</th>
                        <th style="width: 30%">Short URL</th>
                        <th style="width: 40%">Description</th>
                        <th style="width: 10%">Clicks</th>
                        <th style="width: 15%"></th>
                    </tr>
                </thead>
                <tbody id="popularLinksTableBody">
                    <!-- Populated by JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Mobile/Tablet Card View (below lg) -->
    <div class="d-lg-none">
        <div id="popularLinksCards" class="row">
            <!-- Populated by JavaScript -->
        </div>
    </div>

    <!-- No Links Message -->
    <div id="noLinksMessage" class="row" style="display: none;">
        <div class="col-12">
            <div class="alert alert-info text-center">
                <p class="mb-0">No short links have been created yet.</p>
            </div>
        </div>
    </div>

    <!-- Bootstrap Toast for success/error messages -->
    <div class="toast-container position-fixed top-0 end-0 p-3">
        <div id="toastNotification" class="toast align-items-center border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" id="toastMessage"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<!-- App JS -->
<script src="/static/js/app.js"></script>
<script src="/static/js/dms-page-loader.js" defer></script>
<script th:inline="javascript">
    /*<![CDATA[*/
    window.shortLinksConfig = {
        canAccessAdmin: /*[[${can_access_admin}]]*/ false,
        username: /*[[${username}]]*/ ''
    };
    /*]]>*/
</script>
<script>
    let namespaces = [];

    // Load and display popular short links
    async function loadPopularLinks() {
        try {
            const namespacesResponse = await fetch('/backend-api/short-links/namespaces');
            const namespacesResult = await namespacesResponse.json();
            namespaces = (namespacesResult.status === 'SUCCESS' && namespacesResult.data) || [];

            const response = await fetch('/backend-api/short-links/links/popular?limit=20');
            const result = await response.json();

            if (result.status === 'SUCCESS' && result.data && result.data.length > 0) {
                displayPopularLinks(result.data);
                document.getElementById('noLinksMessage').style.display = 'none';
            } else {
                document.getElementById('popularLinksTableBody').innerHTML = '';
                document.getElementById('popularLinksCards').innerHTML = '';
                document.getElementById('noLinksMessage').style.display = 'block';
            }
        } catch (error) {
            console.error('Error loading popular links:', error);
            document.getElementById('popularLinksTableBody').innerHTML = `
                <tr>
                    <td colspan="6">
                        <div class="alert alert-danger mb-0">
                            Error loading popular short links. Please try again later.
                        </div>
                    </td>
                </tr>
            `;
            document.getElementById('popularLinksCards').innerHTML = `
                <div class="col-12">
                    <div class="alert alert-danger">
                        Error loading popular short links. Please try again later.
                    </div>
                </div>
            `;
        }
    }

    function displayPopularLinks(links) {
        const tableBody = document.getElementById('popularLinksTableBody');
        const cardsContainer = document.getElementById('popularLinksCards');

        tableBody.innerHTML = '';
        cardsContainer.innerHTML = '';

        links.forEach((item, index) => {
            const link = item.link;
            const clicks = item.clicks || 0;
            const safePath = escapeHtml(formatPath(link));
            const safeDescription = escapeHtml(link.description) || '—';
            const safeDestinationUrl = escapeHtml(link.destinationUrl);

            // Desktop Table Row
            const row = document.createElement('tr');
            row.style.cursor = 'pointer';
            row.onclick = () => window.location.href = `/short-links/${link.id}`;
            row.innerHTML = `
                <td>
                    <span class="rank-badge">${index + 1}</span>
                </td>
                <td>
                    <code class="link-path">dallas.ms/${safePath}</code>
                </td>
                <td>
                    <span class="text-muted small">${safeDescription}</span>
                </td>
                <td>
                    <span class="click-count">
                        <span class="material-symbols-outlined" style="font-size: 14px; vertical-align: middle;">touch_app</span>
                        ${clicks}
                    </span>
                </td>
                <td>
                    <button type="button" onclick="copyToClipboard('dallas.ms/${safePath}', event); event.stopPropagation();"
                            class="btn btn-sm btn-outline-secondary me-1" title="Copy link"
                            data-track-action="short-link-copy" data-track-label="${safePath}">
                        <span class="material-symbols-outlined" style="font-size: 16px;">content_copy</span>
                    </button>
                    <a href="/short-links/${link.id}" onclick="event.stopPropagation();"
                       class="btn btn-sm btn-outline-primary" title="View details">
                        <span class="material-symbols-outlined" style="font-size: 16px;">info</span>
                    </a>
                </td>
            `;
            tableBody.appendChild(row);

            // Mobile Card
            const card = document.createElement('div');
            card.className = 'col-md-6 mb-4';
            card.innerHTML = `
                <div class="card short-link-card shadow-sm h-100" style="cursor: pointer;" onclick="window.location.href='/short-links/${link.id}'">
                    <div class="card-body d-flex flex-column">
                        <div class="d-flex justify-content-between align-items-start mb-3">
                            <h5 class="card-title mb-0">#${index + 1}</h5>
                            <span class="click-count">
                                <span class="material-symbols-outlined" style="font-size: 16px; vertical-align: middle;">touch_app</span>
                                ${clicks}
                            </span>
                        </div>
                        <p class="text-muted small mb-3">${safeDescription === '—' ? 'No description' : safeDescription}</p>
                        <div class="mb-3">
                            <p class="small text-muted mb-1">Short URL:</p>
                            <p class="link-path mb-0">dallas.ms/${safePath}</p>
                        </div>
                        <div class="mt-auto d-flex gap-2">
                            <button type="button" onclick="copyToClipboard('dallas.ms/${safePath}', event); event.stopPropagation();"
                                    class="btn btn-sm btn-outline-secondary flex-grow-1"
                                    data-track-action="short-link-copy" data-track-label="${safePath}">
                                <span class="material-symbols-outlined" style="font-size: 16px; vertical-align: middle;">content_copy</span>
                                Copy
                            </button>
                            <a href="/short-links/${link.id}" onclick="event.stopPropagation();"
                               class="btn btn-sm btn-outline-primary flex-grow-1">
                                <span class="material-symbols-outlined" style="font-size: 16px; vertical-align: middle;">info</span>
                                Details
                            </a>
                        </div>
                    </div>
                </div>
            `;
            cardsContainer.appendChild(card);
        });
    }

    function formatPath(link) {
        const namespace = namespaces.find(ns => ns.id === link.namespaceId);
        const primaryAlias = namespace?.aliases.find(a => a.isPrimary)?.alias || namespace?.aliases[0]?.alias;
        return namespace && primaryAlias ? `${primaryAlias}/${link.slug}` : link.slug;
    }

    function copyToClipboard(text, event) {
        // Prepend https:// to the link
        const fullUrl = 'https://' + text;
        navigator.clipboard.writeText(fullUrl).then(() => {
            showToast('Copied to clipboard: ' + fullUrl, 'success');
        }).catch(err => {
            console.error('Error copying to clipboard:', err);
            showToast('Failed to copy to clipboard', 'danger');
        });

        // Let the click event propagate for tracking
        // The event will bubble up and be caught by the action tracker
    }

    function showToast(message, type = 'success') {
        const toastEl = document.getElementById('toastNotification');
        const toastMessage = document.getElementById('toastMessage');

        // Set message
        toastMessage.textContent = message;

        // Set color based on type
        toastEl.className = 'toast align-items-center border-0 text-bg-' + type;

        // Show toast
        const toast = new bootstrap.Toast(toastEl);
        toast.show();
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // Load popular links on page load
    document.addEventListener('DOMContentLoaded', loadPopularLinks);
</script>
</body>
</html>
