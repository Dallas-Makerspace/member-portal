<!DOCTYPE html>
<html lang="en-US" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="initial-scale=1, width=device-width"/>
    <title>dallas.ms Short Link</title>

    <meta property="og:type" content="website"/>
    <meta property="og:site_name" content="Dallas Makerspace"/>
    <meta property="og:title" th:content="${shortUrl}"/>
    <meta property="og:description" th:content="${ogDescription}"/>
    <meta property="og:image" th:content="${ogImage}"/>
    <meta property="og:url" th:content="${shortUrl}"/>

    <meta name="twitter:card" content="summary"/>
    <meta name="twitter:title" th:content="${shortUrl}"/>
    <meta name="twitter:description" th:content="${ogDescription}"/>
    <meta name="twitter:image" th:content="${ogImage}"/>

    <!-- PWA Meta Tags -->
    <th:block th:replace="~{fragments/pwa-meta :: pwa-meta}"></th:block>

    <link rel="stylesheet" href="/static/styles/global.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <h2 class="mt-3 mb-2" th:text="${shortUrl}"></h2>
            <p class="text-muted" th:text="${ogDescription}"></p>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<!-- App JS -->
<script src="/static/js/app.js"></script>
<!-- Page Loader (REQUIRED for all pages) -->
<script src="/static/js/dms-page-loader.js" defer></script>
</body>
</html>
