<!DOCTYPE html>
<html lang="en-US" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="initial-scale=1, width=device-width"/>
    <title>Short Link Details - DMS Member Portal</title>

    <!-- PWA Meta Tags -->
    <th:block th:replace="~{fragments/pwa-meta :: pwa-meta}"></th:block>

    <link rel="stylesheet" href="/static/styles/global.css"/>
    <link rel="stylesheet" href="/static/styles/profile.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800;900&display=swap">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        .qr-code-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        .link-path {
            color: #0d6efd;
            font-weight: 500;
            font-family: monospace;
            font-size: 1.2rem;
        }
        .stat-card {
            text-align: center;
            padding: 20px;
        }
        .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
            color: #0d6efd;
        }
        .stat-label {
            color: #6c757d;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
<header class="top-nav" th:replace="~{fragments/header :: header}"></header>
<div class="container pb-8">
    <div class="row">
        <div class="col-12">
            <h1 class="mt-4 mb-2" id="linkTitle">Loading...</h1>
            <p class="text-muted mb-4" id="linkDescription">Loading link details...</p>
        </div>
    </div>

    <div class="row">
        <!-- Left Column: Link Info & QR Code -->
        <div class="col-lg-6 mb-4">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h4 class="card-title mb-4">Link Information</h4>

                    <div class="mb-4">
                        <label class="form-label text-muted small">Short URL</label>
                        <div class="d-flex align-items-center gap-2">
                            <div class="link-path flex-grow-1" id="shortUrl">dallas.ms/...</div>
                            <button type="button" onclick="copyShortUrl(event);"
                                    class="btn btn-sm btn-outline-secondary" title="Copy short link"
                                    data-track-action="short-link-copy-details" id="copyShortUrlBtn">
                                <span class="material-symbols-outlined" style="font-size: 16px;">content_copy</span>
                            </button>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-muted small">Destination</label>
                        <a href="#" id="destinationUrl" target="_blank" rel="noopener noreferrer"
                           class="d-block text-break">Loading...</a>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-muted small">QR Code</label>
                        <div class="qr-code-container" id="qrcode"></div>
                        <div class="text-center mt-2">
                            <button class="btn btn-sm btn-outline-primary" onclick="downloadQRCode()">
                                <span class="material-symbols-outlined" style="font-size: 16px; vertical-align: middle;">download</span>
                                Download QR Code
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Column: Statistics -->
        <div class="col-lg-6 mb-4">
            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <h4 class="card-title mb-4">Statistics</h4>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <div class="stat-card">
                                <div class="stat-number" id="totalClicks">0</div>
                                <div class="stat-label">Total Clicks</div>
                            </div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <div class="stat-card">
                                <div class="stat-number" id="linkStatus">—</div>
                                <div class="stat-label">Status</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Coming Soon: Charts & Recent Activity -->
            <div class="card shadow-sm">
                <div class="card-body">
                    <h4 class="card-title mb-3">Coming Soon</h4>
                    <ul class="list-unstyled text-muted">
                        <li class="mb-2">📊 Click chart over past 90 days</li>
                        <li class="mb-2">👥 Recent members who clicked</li>
                        <li>📅 Click timeline</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Toast for success/error messages -->
    <div class="toast-container position-fixed top-0 end-0 p-3">
        <div id="toastNotification" class="toast align-items-center border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" id="toastMessage"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<!-- QR Code Library -->
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<!-- App JS -->
<script src="/static/js/app.js"></script>
<script src="/static/js/dms-page-loader.js" defer></script>
<script th:inline="javascript">
    /*<![CDATA[*/
    const linkId = /*[[${link_id}]]*/ 0;
    const isInfra = /*[[${authz.can('MANAGE_SHORTLINKS')}]]*/ false;
    /*]]>*/

    let linkData = null;
    let namespaces = [];

    async function loadLinkDetails() {
        try {
            // Load namespaces so we can resolve the link's namespace alias, if any
            const namespacesResponse = await fetch('/backend-api/short-links/namespaces');
            const namespacesResult = await namespacesResponse.json();
            namespaces = (namespacesResult.status === 'SUCCESS' && namespacesResult.data) || [];

            // Load link details
            const response = await fetch(`/backend-api/short-links/links/${linkId}`);
            const result = await response.json();

            if (result.status === 'SUCCESS' && result.data) {
                linkData = result.data;

                // Load all links with click counts to get the click count for this link
                const popularResponse = await fetch('/backend-api/short-links/links/popular?limit=1000');
                const popularResult = await popularResponse.json();

                if (popularResult.status === 'SUCCESS' && popularResult.data) {
                    const linkWithClicks = popularResult.data.find(item => item.link.id === linkId);
                    if (linkWithClicks) {
                        linkData.clickCount = linkWithClicks.clicks;
                    }
                }

                displayLinkDetails(linkData);
            } else {
                showError('Link not found');
            }
        } catch (error) {
            console.error('Error loading link details:', error);
            showError('Failed to load link details');
        }
    }

    function displayLinkDetails(link) {
        // Update title and description
        document.getElementById('linkTitle').textContent = link.slug;
        document.getElementById('linkDescription').textContent = link.description || 'No description';

        // Short URL - prefix with the namespace's primary alias, if the link belongs to one
        const namespace = namespaces.find(ns => ns.id === link.namespaceId);
        const primaryAlias = namespace?.aliases.find(a => a.isPrimary)?.alias || namespace?.aliases[0]?.alias;
        const path = namespace && primaryAlias ? `${primaryAlias}/${link.slug}` : link.slug;
        const shortUrl = `dallas.ms/${path}`;
        document.getElementById('shortUrl').textContent = shortUrl;

        // Update copy button tracking label
        const copyBtn = document.getElementById('copyShortUrlBtn');
        if (copyBtn) {
            copyBtn.setAttribute('data-track-label', link.slug);
        }

        // Destination URL
        const destEl = document.getElementById('destinationUrl');
        destEl.href = link.destinationUrl;
        destEl.textContent = link.destinationUrl;

        // Status
        document.getElementById('linkStatus').textContent = link.isActive ? 'Active' : 'Inactive';
        document.getElementById('linkStatus').style.color = link.isActive ? '#28a745' : '#dc3545';

        // Total clicks (using clickCount from the link object)
        document.getElementById('totalClicks').textContent = link.clickCount || 0;

        // Generate QR Code
        generateQRCode(`https://${shortUrl}`);
    }

    function copyShortUrl(event) {
        const shortUrlText = document.getElementById('shortUrl').textContent;
        const fullUrl = 'https://' + shortUrlText;
        navigator.clipboard.writeText(fullUrl).then(() => {
            showToast('Copied to clipboard: ' + fullUrl, 'success');
        }).catch(err => {
            console.error('Error copying to clipboard:', err);
            showToast('Failed to copy to clipboard', 'danger');
        });

        // Let the click event propagate for tracking
        // The event will bubble up and be caught by the action tracker
    }

    function showToast(message, type = 'success') {
        const toastEl = document.getElementById('toastNotification');
        const toastMessage = document.getElementById('toastMessage');

        if (!toastEl || !toastMessage) return;

        // Set message
        toastMessage.textContent = message;

        // Set color based on type (success = green, danger = red)
        toastEl.className = 'toast align-items-center border-0 text-bg-' + type;

        // Show toast
        const toast = new bootstrap.Toast(toastEl, {
            autohide: true,
            delay: 3000
        });
        toast.show();
    }

    function generateQRCode(url) {
        const qrContainer = document.getElementById('qrcode');
        qrContainer.innerHTML = ''; // Clear any existing QR code

        new QRCode(qrContainer, {
            text: url,
            width: 256,
            height: 256,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.H
        });
    }

    function downloadQRCode() {
        const canvas = document.querySelector('#qrcode canvas');
        if (canvas) {
            const url = canvas.toDataURL('image/png');
            const a = document.createElement('a');
            a.href = url;
            a.download = `qr-code-${linkData.slug}.png`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    }

    function showError(message) {
        document.getElementById('linkTitle').textContent = 'Error';
        document.getElementById('linkDescription').textContent = message;
    }

    // Load link details on page load
    document.addEventListener('DOMContentLoaded', loadLinkDetails);
</script>
</body>
</html>
