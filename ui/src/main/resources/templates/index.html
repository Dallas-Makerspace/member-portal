<!DOCTYPE html>
<html lang="en-US" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="initial-scale=1, width=device-width"/>
    <title>DMS Member Portal</title>

    <!-- PWA Meta Tags -->
    <th:block th:replace="~{fragments/pwa-meta :: pwa-meta}"></th:block>

    <link rel="stylesheet" href="./static/styles/global.css"/>
    <link rel="stylesheet" href="./static/styles/index.css"/>
    <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800;900&display=swap"
    />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<header class="top-nav" th:replace="~{fragments/header :: header}"></header>
<div class="main">
    <section class="main-inner">
        <div class="welcome-member-22-parent">
            <h1 class="welcome-member-22">Welcome, <span th:text="${name}"></span>!</h1>
            <div class="edit-your-profile-wrapper">
                <div class="edit-your-profile" id="editYourProfile">
                    <a th:href="${profile_url}">View your profile</a>
                </div>
            </div>
        </div>
    </section>
</div>

<!-- Featured Projects Row -->
<section th:if="${featured_projects != null and !#lists.isEmpty(featured_projects)}"
         class="featured-projects-section">
    <div class="container">
        <div class="featured-projects-header">
            <div>
                <h2 class="featured-projects-heading">Featured Projects</h2>
                <!--<p class="featured-projects-subtitle">Member creations from Show &amp; Tell</p>-->
            </div>
        </div>
        <div class="featured-projects-track-wrap">
            <button class="featured-scroll-btn featured-scroll-btn--left" aria-label="Scroll left">&#8249;</button>
            <div class="featured-projects-row">
                <a th:each="p : ${featured_projects}"
                   th:href="${p.profileUrl}"
                   class="featured-project-card">
                    <div class="featured-project-img-wrap">
                        <img th:src="${p.imageUrl}" th:alt="${p.memberDisplayName}"
                             class="featured-project-img" loading="lazy"/>
                        <!--<span th:if="${p.likeCount > 0}" class="featured-project-likes-badge">
                            &#10084; <span th:text="${p.likeCount}"></span>
                        </span>-->
                        <div class="featured-project-overlay">
                            <img th:if="${p.memberAvatarUrl != null and !#strings.isEmpty(p.memberAvatarUrl)}"
                                 th:src="${p.memberAvatarUrl}" th:alt="${p.memberDisplayName}"
                                 class="featured-project-avatar" loading="lazy"/>
                            <span th:if="${p.memberAvatarUrl == null or #strings.isEmpty(p.memberAvatarUrl)}"
                                  class="featured-project-avatar-placeholder"></span>
                            <span class="featured-project-author" th:text="${p.memberDisplayName}"></span>
                        </div>
                    </div>
                </a>
            </div>
            <button class="featured-scroll-btn featured-scroll-btn--right" aria-label="Scroll right">&#8250;</button>
        </div>
    </div>
</section>

<!-- Members to Follow: skeleton cards until the suggestions load; hidden if there are none -->
<section th:if="${followsMenuEnabled}" id="membersToFollowSection"
         class="suggested-events-section members-to-follow-section">
    <div class="container">
        <h2 class="suggested-events-heading">Members to Follow</h2>
        <div id="membersToFollowGrid" class="dms-member-grid">
            <div class="dms-member-grid-item member-skeleton" aria-hidden="true">
                <div class="shimmer-line member-skeleton-avatar"></div>
                <div class="member-skeleton-lines">
                    <div class="shimmer-line shimmer-title"></div>
                    <div class="shimmer-line shimmer-meta"></div>
                </div>
            </div>
            <div class="dms-member-grid-item member-skeleton" aria-hidden="true">
                <div class="shimmer-line member-skeleton-avatar"></div>
                <div class="member-skeleton-lines">
                    <div class="shimmer-line shimmer-title"></div>
                    <div class="shimmer-line shimmer-meta"></div>
                </div>
            </div>
            <div class="dms-member-grid-item member-skeleton" aria-hidden="true">
                <div class="shimmer-line member-skeleton-avatar"></div>
                <div class="member-skeleton-lines">
                    <div class="shimmer-line shimmer-title"></div>
                    <div class="shimmer-line shimmer-meta"></div>
                </div>
            </div>
            <div class="dms-member-grid-item member-skeleton" aria-hidden="true">
                <div class="shimmer-line member-skeleton-avatar"></div>
                <div class="member-skeleton-lines">
                    <div class="shimmer-line shimmer-title"></div>
                    <div class="shimmer-line shimmer-meta"></div>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Suggested Events Widget -->
<section class="suggested-events-section">
    <div class="container">
        <div class="suggested-events-header d-flex flex-column flex-sm-row justify-content-sm-between align-items-sm-baseline gap-1 mb-3">
            <h2 id="suggestedEventsHeading" class="suggested-events-heading mb-0">Suggested Events For You</h2>
            <a href="https://calendar.dallasmakerspace.org/events" class="small text-muted text-decoration-underline align-self-end align-self-sm-auto"
               target="_blank" rel="noopener">Browse calendar</a>
        </div>

        <!-- Shimmer skeleton shown while loading -->
        <div id="suggestedEventsSkeleton" class="suggested-events-grid">
            <div class="suggested-event-skeleton">
                <div class="shimmer-line shimmer-badge"></div>
                <div class="shimmer-body">
                    <div class="shimmer-line shimmer-title"></div>
                    <div class="shimmer-line shimmer-meta"></div>
                </div>
            </div>
            <div class="suggested-event-skeleton">
                <div class="shimmer-line shimmer-badge"></div>
                <div class="shimmer-body">
                    <div class="shimmer-line shimmer-title"></div>
                    <div class="shimmer-line shimmer-meta"></div>
                </div>
            </div>
            <div class="suggested-event-skeleton">
                <div class="shimmer-line shimmer-badge"></div>
                <div class="shimmer-body">
                    <div class="shimmer-line shimmer-title"></div>
                    <div class="shimmer-line shimmer-meta"></div>
                </div>
            </div>
            <div class="suggested-event-skeleton">
                <div class="shimmer-line shimmer-badge"></div>
                <div class="shimmer-body">
                    <div class="shimmer-line shimmer-title"></div>
                    <div class="shimmer-line shimmer-meta"></div>
                </div>
            </div>
        </div>

        <!-- Content shown after fetch -->
        <div id="suggestedEventsContent" class="suggested-events-grid" style="display:none;"></div>

        <!-- Null state -->
        <p id="suggestedEventsEmpty" class="suggested-events-empty" style="display:none;">No upcoming events to suggest
            right now.</p>
    </div>
</section>

<!-- Suggested Online Courses (DMS Learn) - hidden unless the moodle.enabled flag is on and there are picks -->
<section id="suggestedCoursesSection" class="suggested-events-section" style="display:none;">
    <div class="container">
        <div class="suggested-events-header d-flex flex-column flex-sm-row justify-content-sm-between align-items-sm-baseline gap-1 mb-3">
            <h2 class="suggested-events-heading mb-0">Suggested Online Courses</h2>
            <a id="suggestedCoursesBrowse" class="small text-muted text-decoration-underline align-self-end align-self-sm-auto" target="_blank" rel="noopener"
               style="display:none;">Browse courses</a>
        </div>
        <div id="suggestedCoursesContent" class="suggested-events-grid"></div>
    </div>
</section>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        fetch('/api/suggested-courses')
            .then(function (res) { return res.ok ? res.json() : Promise.reject(res.status); })
            .then(function (data) {
                var courses = (data && data.enabled && data.courses) || [];
                if (courses.length === 0) return;
                var container = document.getElementById('suggestedCoursesContent');
                courses.forEach(function (c) {
                    var card = document.createElement('a');
                    card.href = (c.url && /^https:\/\//i.test(c.url)) ? c.url : '#';
                    card.className = 'suggested-event-card';
                    card.target = '_blank';
                    card.rel = 'noopener noreferrer';
                    var meta = [];
                    if (c.committeeName || c.categoryName) meta.push(c.committeeName || c.categoryName);
                    if (c.authorName) meta.push(c.authorName);
                    if (c.inProgress) meta.push(c.progress > 0 ? 'In progress ' + c.progress + '%' : 'Enrolled');
                    card.innerHTML =
                        '<div class="suggested-event-date-badge">' +
                        '<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="#5b7194" aria-hidden="true">' +
                        '<path d="M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82zM12 3 1 9l11 6 9-4.91V17h2V9L12 3z"/></svg>' +
                        '</div>' +
                        '<div class="suggested-event-info">' +
                        '<span class="suggested-event-name">' + escapeCourseHtml(c.name) + '</span>' +
                        '<span class="suggested-event-meta">' + escapeCourseHtml(meta.join(' • ')) + '</span>' +
                        '</div>' +
                        '<span class="suggested-event-chevron">&#8250;</span>';
                    container.appendChild(card);
                });
                var browse = document.getElementById('suggestedCoursesBrowse');
                if (data.learnUrl && /^https:\/\//i.test(data.learnUrl)) {
                    browse.href = data.learnUrl;
                    browse.style.display = '';
                }
                document.getElementById('suggestedCoursesSection').style.display = '';
            })
            .catch(function () { /* stay hidden */ });

        function escapeCourseHtml(str) {
            return String(str == null ? '' : str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }
    });
</script>

<script th:if="${followsMenuEnabled}" type="module" src="/static/js/dms-member-card.js"></script>
<script th:if="${followsMenuEnabled}">
    document.addEventListener('DOMContentLoaded', function () {
        var VISIBLE = 4;
        var section = document.getElementById('membersToFollowSection');
        function hideSection() { section.style.display = 'none'; }
        fetch('/api/members-to-follow')
            .then(function (res) { return res.ok ? res.json() : Promise.reject(res.status); })
            .then(function (data) {
                var members = ((data && data.enabled && data.members) || []).slice(0, VISIBLE);
                if (members.length === 0) { hideSection(); return; }
                var grid = document.getElementById('membersToFollowGrid');
                grid.replaceChildren();
                members.forEach(function (m) {
                    var item = document.createElement('div');
                    item.className = 'dms-member-grid-item';
                    var card = document.createElement('dms-member-card');
                    card.setAttribute('username', m.username);
                    card.setAttribute('state', 'mini');
                    item.appendChild(card);
                    grid.appendChild(item);
                });
            })
            .catch(hideSection);
    });
</script>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        fetch('/api/suggested-events')
            .then(function (res) { return res.ok ? res.json() : Promise.reject(res.status); })
            .then(function (data) {
            var events = data.events || [];
            document.getElementById('suggestedEventsSkeleton').style.display = 'none';
            if (!events || events.length === 0) {
                document.getElementById('suggestedEventsEmpty').style.display = '';
                return;
            }
            var container = document.getElementById('suggestedEventsContent');
            events.forEach(function (ev) {
                var card = document.createElement('a');
                card.href = (ev.url && /^https:\/\//i.test(ev.url)) ? ev.url : '#';
                card.className = 'suggested-event-card';
                card.target = '_blank';
                card.rel = 'noopener noreferrer';
                // Parse "Wed, Mar 11, 2026 at 6:30 PM" → month/day/time
                var parsed = parseEventDate(ev.eventStart || '');
                var org = ev.organizer || {};
                var metaParts = [];
                if (parsed.time) metaParts.push(parsed.time);
                if (org.displayName || org.username) metaParts.push(org.displayName || org.username);
                card.innerHTML =
                '<div class="suggested-event-date-badge">' +
                '<span class="suggested-event-badge-month">' + escapeHtml(parsed.month) + '</span>' +
                '<span class="suggested-event-badge-day">' + escapeHtml(parsed.day) + '</span>' +
                '</div>' +
                '<div class="suggested-event-info">' +
                '<span class="suggested-event-name">' + escapeHtml(ev.name) + '</span>' +
                '<span class="suggested-event-meta">' + escapeHtml(metaParts.join(' \u2022 ')) + '</span>' +
                '</div>' +
                '<span class="suggested-event-chevron">&#8250;</span>';
                container.appendChild(card);
            });
            container.style.display = '';
        })
            .catch(function () {
            document.getElementById('suggestedEventsSkeleton').style.display = 'none';
            // Silently hide on error — no broken layout
        });

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // Parse "Wed, Mar 11, 2026 at 6:30 PM" → { month:"MAR", day:"11", time:"6:30 PM" }
        function parseEventDate(dateStr) {
            try {
                var parts = dateStr.split(', ');
                var monthDay = (parts[1] || '').split(' ');
                var timePart = (parts[2] || '').split(' at ');
                return {
                    month: (monthDay[0] || '').toUpperCase(),
                    day: monthDay[1] || '',
                    time: timePart[1] || ''
                };
            } catch (e) {
                return { month: '', day: '', time: dateStr };
            }
        }
    });
</script>

<!-- Bootstrap JS should be at the bottom of the body -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<!-- App JS -->
<script src="/static/js/app.js"></script>
<script src="/static/js/dms-page-loader.js" defer></script>
</body>
</html>
