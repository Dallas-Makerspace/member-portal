<!DOCTYPE html>
<html lang="en-US" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  One notification card in the inbox feed (see NotificationsInboxFeed.kt for the item map).
  The title is the only link and is stretched over the card; the CTA text is decoration.
-->
<li th:fragment="card(item, pageSize, level)" class="inbox-item"
    th:classappend="${item['position'] != null and item['position'] > pageSize} ? 'inbox-extra' : ''"
    th:attr="hidden=${item['position'] != null and item['position'] > pageSize} ? 'hidden'">
    <article class="inbox-card" th:classappend="${item['unread']} ? 'is-unread'">
        <span class="inbox-icon" aria-hidden="true" th:switch="${item['kind']}">
            <span class="material-symbols-outlined" th:case="'event'">event</span>
            <span class="material-symbols-outlined" th:case="'class'">school</span>
            <span class="material-symbols-outlined" th:case="'project'">construction</span>
            <span class="material-symbols-outlined" th:case="'course'">play_circle</span>
            <span class="material-symbols-outlined" th:case="*">notifications</span>
        </span>
        <div class="inbox-body">
            <!-- Text and thumbnail share a row; the meta row (and its CTA) spans the full width so the
                 CTA sits at the same right edge on every card. -->
            <div class="inbox-main">
                <div class="inbox-text">
                    <div class="inbox-card-title" role="heading" th:attr="aria-level=${level}">
                        <a th:if="${!#strings.isEmpty(item['url'])}" class="inbox-link stretched-link"
                           th:href="${item['url']}">
                            <span th:if="${item['unread']}" class="visually-hidden">New: </span><span
                                th:text="${item['title']}"></span>
                        </a>
                        <th:block th:if="${#strings.isEmpty(item['url'])}">
                            <span th:if="${item['unread']}" class="visually-hidden">New: </span><span
                                th:text="${item['title']}"></span>
                        </th:block>
                    </div>
                    <p class="inbox-excerpt" th:if="${!#strings.isEmpty(item['excerpt'])}"
                       th:text="${item['excerpt']}"></p>
                </div>
                <img th:if="${!#strings.isEmpty(item['imageUrl'])}" class="inbox-thumb" alt="" loading="lazy"
                     th:src="${item['imageUrl']}">
            </div>
            <p class="inbox-meta">
                <span th:if="${!#strings.isEmpty(item['whenLine'])}" th:text="${item['whenLine']}"></span>
                <dms-relative-date th:if="${#strings.isEmpty(item['whenLine']) and item['when'] != null}"
                                   th:attr="timestamp=${item['when']}"></dms-relative-date>
                <span th:if="${!#strings.isEmpty(item['sender'])}" class="inbox-sep"
                      th:text="${item['sender']}"></span>
                <span th:if="${item['posted'] != null}" class="inbox-sep" th:text="${item['posted']}"></span>
                <span th:if="${item['note'] != null}" class="inbox-note inbox-sep"
                      th:classappend="${item['noteProblem']} ? 'is-problem'"
                      th:text="${item['note']}"></span>
                <span th:if="${!#strings.isEmpty(item['errorDetail'])}"
                      class="inbox-error font-monospace" th:text="${item['errorDetail']}"></span>
                <span th:if="${!#strings.isEmpty(item['ctaLabel'])}" class="inbox-cta" aria-hidden="true"
                      th:text="${item['ctaLabel']} + ' ›'"></span>
            </p>
        </div>
    </article>
</li>
</body>
</html>
