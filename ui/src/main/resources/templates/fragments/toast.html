<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  Shared toast host. Two modes, same markup:
   - Server-rendered: set ${toast_message} (+ optional ${toast_btn_label}/${toast_btn_url}) in the
     handler's model; renders pre-shown, auto-hidden by app.js after 20s.
   - Client-side: call showToast(message, type) from app.js; self-dismisses after ~5s.
  Uses id "dmsToast", not the legacy "liveToast" id some templates still render inline -
  app.js's 20s auto-hide targets "liveToast" specifically so it never cuts off a JS toast fired
  after page load.
-->
<div th:fragment="toast" class="toast-container position-fixed top-0 end-0 p-3">
    <div id="dmsToast"
         class="toast align-items-center border-0 text-bg-success"
         th:classappend="${toast_message} ? 'show' : ''"
         th:attr="data-server-rendered=${toast_message} ? 'true' : null"
         role="alert"
         aria-live="assertive"
         aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body" id="dmsToastMessage" th:text="${toast_message}"></div>
            <a th:if="${toast_btn_label}"
               type="button"
               class="btn btn-link link-light me-2 m-auto"
               th:href="${toast_btn_url}"
               th:text="${toast_btn_label}"></a>
            <button type="button"
                    class="btn-close btn-close-white me-2 m-auto"
                    data-bs-dismiss="toast"
                    aria-label="Close"></button>
        </div>
    </div>
</div>
</body>
</html>
