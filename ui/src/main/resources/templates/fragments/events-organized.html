<!DOCTYPE html>
<html lang="en-US" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  The profile's "Events Organized" card. Only the first few events show until expanded;
  /profile/@user#events-organized opens it expanded (static/js/dms-expandable.js). Hidden items carry
  data-expandable-extra="true": Thymeleaf drops attributes whose value is an empty string.
-->
<div th:fragment="card(events, hiddenCount)" id="events-organized" data-expandable
     class="dms-card shadow-sm mt-4">
    <div class="card-body pt-0 pb-4">
        <h4 class="card-title mt-3 mb-4 dms-card-title">Events Organized</h4>
        <div class="list-group list-group-flush" id="events-organized-list">
            <a th:each="event : ${events}"
               th:href="${event.url}"
               target="_blank"
               class="list-group-item list-group-item-action px-0 border-0 event-item"
               th:classappend="${event.isUpcoming} ? 'event-upcoming' : 'event-past'"
               th:attr="hidden=${event.collapsed} ? 'hidden',data-expandable-extra=${event.collapsed} ? 'true'">
                <div class="d-flex align-items-start">
                    <span class="material-symbols-outlined card-item-icon mt-1 ms-md-3">event</span>
                    <div class="flex-grow-1">
                        <div class="fw-medium event-name" th:text="${event.name}"></div>
                        <small class="text-muted">
                            <span th:text="${event.eventStart}"></span>
                            <span class="ms-1 fw-semibold"><dms-relative-date
                                    th:attr="timestamp=${event.eventStartRaw}" prefix="(" suffix=")"
                                    relativeOnly="true"></dms-relative-date></span>
                        </small>
                    </div>
                    <span class="material-symbols-outlined text-muted ms-2 me-md-3 align-self-center"
                          style="font-size: 18px;">open_in_new</span>
                </div>
            </a>
        </div>
        <button th:if="${hiddenCount > 0}" type="button" class="btn btn-link px-0 mt-2"
                data-expandable-toggle aria-expanded="false" aria-controls="events-organized-list"
                th:attr="data-more-label='Show ' + ${hiddenCount} + ' more',data-less-label='Show fewer'"
                th:text="'Show ' + ${hiddenCount} + ' more'"></button>
    </div>
</div>
</body>
</html>
