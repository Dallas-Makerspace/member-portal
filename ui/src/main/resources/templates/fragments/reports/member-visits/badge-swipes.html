<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Recent Badge Swipes</title>
</head>
<body>
<div th:fragment="report">
    <!-- Restriction note - ALWAYS shown to all users -->
    <div class="alert alert-info" role="alert">
        <strong>Note:</strong> This report is restricted to Officers and the IT Infrastructure team. Committee chairs can see their own area's doors.
    </div>

    <!-- Report content - ONLY shown to authorized users -->
    <div th:if="${badgeSwipes['allowed']}">
        <!-- Data visualizer component -->
        <dms-data-visualizer
                id="badge-swipes-visualizer"
                th:attr="dataUrl=${badgeSwipes['dataUrl']},title=${badgeSwipes['title']}"
                renderAs="table"
                description=""
                filterable="true"
                alwaysShowRawData="true"
        ></dms-data-visualizer>
    </div>
</div>
</body>
</html>
