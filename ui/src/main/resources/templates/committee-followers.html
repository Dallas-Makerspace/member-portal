<!DOCTYPE html>
<html lang="en-US" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="initial-scale=1, width=device-width"/>

    <!-- PWA Meta Tags -->
    <th:block th:replace="~{fragments/pwa-meta :: pwa-meta}"></th:block>

    <link rel="stylesheet" href="/static/styles/global.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800;900&display=swap">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0&display=swap"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title th:text="${committee.name} + ' followers'"></title>
</head>
<body>
<header class="top-nav" th:replace="~{fragments/header :: header}"></header>
<div class="container pb-8">
    <div class="row">
        <div class="col-md-10 col-lg-9 mx-auto">
            <div class="mt-4">
                <a th:href="'/committees/' + ${committee.slug}" class="text-decoration-none">
                    <span class="material-symbols-outlined align-middle" style="font-size:18px;">arrow_back</span>
                    Back to <span th:text="${committee.name}"></span>
                </a>
            </div>

            <div class="dms-card shadow-sm mt-3">
                <div class="card-body">
                    <h4 class="card-title mt-3 mb-3 dms-card-title">
                        <span th:text="${committee.name}"></span> followers
                        <span class="badge bg-secondary ms-1" th:text="${total}"></span>
                    </h4>
                    <div th:if="${#lists.isEmpty(followers)}" class="text-muted py-2">
                        No one follows this committee yet.
                    </div>
                    <th:block th:unless="${#lists.isEmpty(followers)}">
                        <div th:replace="~{fragments/member-grid :: member-grid(${followers}, false, null)}"></div>
                    </th:block>

                    <nav th:if="${page_count > 1}" class="d-flex justify-content-between align-items-center mt-4"
                         aria-label="Followers pages">
                        <a th:if="${page > 1}" class="btn btn-outline-secondary btn-sm"
                           th:href="'/committees/' + ${committee.slug} + '/followers?page=' + ${page - 1}">Previous</a>
                        <span th:unless="${page > 1}"></span>
                        <span class="text-muted small"
                              th:text="'Page ' + ${page} + ' of ' + ${page_count}"></span>
                        <a th:if="${page < page_count}" class="btn btn-outline-secondary btn-sm"
                           th:href="'/committees/' + ${committee.slug} + '/followers?page=' + ${page + 1}">Next</a>
                        <span th:unless="${page < page_count}"></span>
                    </nav>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
<!-- App JS -->
<script src="/static/js/app.js"></script>
<!-- Page Loader (REQUIRED for all pages) -->
<script src="/static/js/dms-page-loader.js" defer></script>
<script type="module" src="/static/js/dms-member-card.js"></script>
</body>
</html>
