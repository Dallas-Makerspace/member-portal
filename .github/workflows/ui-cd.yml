name: UI CD

# Deploys the member profile UI to production
# Includes: Gradle caching, Trivy security scanning, basic health checks
# Triggered after CI passes to ensure e2e tests have run before deploying

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

jobs:
  check-changes:
    name: Check for relevant changes
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true
      - id: check
        # Diffs against the deployed-ui tag (moved to HEAD by common-cd.yml on every successful
        # deploy), not just HEAD^. A plain HEAD^ diff only sees the single commit that triggered
        # this run, so any ui/ change gets silently skipped if it lands underneath a non-ui commit
        # in the same push (push events fire once per push, not once per commit). Falls back to
        # HEAD^ before the tag exists (e.g. right after this fix lands).
        run: |
          if git rev-parse -q --verify refs/tags/deployed-ui >/dev/null; then
            BASE=deployed-ui
          else
            BASE=HEAD^
          fi
          if git diff --name-only "$BASE" HEAD | grep -qE '^(ui/|\.github/workflows/(ui-cd|common-cd)\.yml)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check-changes
    if: needs.check-changes.outputs.changed == 'true'
    uses: ./.github/workflows/common-cd.yml
    with:
      component: ui
      internal_port: "8000"
      healthcheck_path: /readyz
      env_file_path: ~/member-profile/actions-runner-service/.env.ui
      image_name: dallas-makerspace/member-portal/ui
      package_name: member-portal/ui
      container_name: member-profile-ui
    secrets: inherit
