name: Cast Agent CD

# Builds and deploys the cast agent (cast-agent/), which keeps committee dashboards showing on the TVs.
# It runs on docker-h0 (the self-hosted runner's host): that host is on the Member VLAN and routed to
# the IoT VLAN, so it can reach every TV's Cast port without mDNS.
#
# Deploying needs RECEIVER_APP_ID (the Google Cast receiver's App ID) in the agent's env file on the
# runner. Until it is set the deploy step is skipped with a notice, so merging this is safe early.

on:
  push:
    branches: [master]
    paths:
      - 'cast-agent/**'
      - '.github/workflows/cast-agent-cd.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: dallas-makerspace/member-portal/cast-agent
  ENV_FILE_PATH: ~/member-profile/actions-runner-service/.env.cast-agent

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cast-agent
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cast-agent/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  build-and-push-image:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v6
      - name: Log in to Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
          DOCKER_BUILD_SUMMARY: 'false'
        with:
          context: cast-agent
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to docker-h0
    needs: build-and-push-image
    runs-on: self-hosted
    timeout-minutes: 10
    concurrency:
      group: deploy-cast-agent
      cancel-in-progress: false
    environment:
      name: production
    steps:
      - name: Check the agent is configured
        id: config
        shell: bash
        run: |
          ENV_FILE=$(eval echo "$ENV_FILE_PATH")
          if [ ! -f "$ENV_FILE" ]; then
            echo "::notice::$ENV_FILE does not exist; skipping the deploy"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif ! grep -qE '^RECEIVER_APP_ID=.+' "$ENV_FILE"; then
            echo "::notice::RECEIVER_APP_ID is not set in the agent's env file; skipping the deploy"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Container registry
        if: steps.config.outputs.ready == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.PAT }}

      - name: Pull the image and replace the running agent
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-and-push-image.outputs.image-digest }}"
          ENV_FILE=$(eval echo "$ENV_FILE_PATH")
          docker pull "$IMAGE_REF"
          docker rm -f cast-agent 2>/dev/null || true
          # member-portal network: the agent reaches the service by name; TVs are reached by address
          # over the host's own routes (bridge NAT), so no host networking is needed.
          docker run -d --restart unless-stopped \
            --name cast-agent \
            --network member-portal \
            --env-file "$ENV_FILE" \
            "$IMAGE_REF"
          sleep 10
          if ! docker ps --filter name=cast-agent --filter status=running -q | grep -q .; then
            docker logs cast-agent | tail -30
            echo "::error::the cast agent did not stay up"
            exit 1
          fi
          docker logs cast-agent | tail -5
