name: Service CD

# Deploys the member profile service to production
# Includes: Gradle caching, Trivy security scanning, basic health checks
# Triggered after CI passes to ensure e2e tests have run before deploying

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

jobs:
  check-changes:
    name: Check for relevant changes
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true
      - id: check
        # Diffs against the deployed-service tag (moved to HEAD by common-cd.yml on every
        # successful deploy), not just HEAD^. A plain HEAD^ diff only sees the single commit that
        # triggered this run, so any service/ change gets silently skipped if it lands underneath a
        # non-service commit in the same push (push events fire once per push, not once per
        # commit). Falls back to HEAD^ before the tag exists (e.g. right after this fix lands).
        run: |
          if git rev-parse -q --verify refs/tags/deployed-service >/dev/null; then
            BASE=deployed-service
          else
            BASE=HEAD^
          fi
          if git diff --name-only "$BASE" HEAD | grep -qE '^(service/|\.github/workflows/(service-cd|common-cd)\.yml)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check-changes
    if: needs.check-changes.outputs.changed == 'true'
    uses: ./.github/workflows/common-cd.yml
    with:
      component: service
      internal_port: "8081"
      healthcheck_path: /health/ready
      env_file_path: ~/member-profile/actions-runner-service/.env.service
      image_name: dallas-makerspace/member-portal/service
      package_name: member-portal/service
      container_name: member-profile-service
      additional_networks: guacamole_guacamole_net
      checkout_ref: ${{ github.event.workflow_run.head_sha }}
    secrets: inherit
