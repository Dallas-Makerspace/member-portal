name: Common CD Workflow

# This common workflow deploys member portal components to production
# Features: Gradle caching, Trivy security scanning, blue-green zero-downtime deploy

on:
  workflow_call:
    inputs:
      component:
        description: 'Component name (service or ui)'
        required: true
        type: string
      internal_port:
        description: 'Internal container port'
        required: true
        type: string
      healthcheck_path:
        description: 'HTTP path on internal_port for readiness probe'
        required: true
        type: string
      env_file_path:
        description: 'Path to environment file on self-hosted runner'
        required: true
        type: string
      image_name:
        description: 'Docker image name'
        required: true
        type: string
      package_name:
        description: 'Container package name for cleanup'
        required: true
        type: string
      container_name:
        description: 'Docker container name'
        required: true
        type: string
      additional_networks:
        description: 'Space-separated list of additional Docker networks to connect with alias during cutover (optional)'
        required: false
        type: string
        default: ''

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push-image:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write
      security-events: write

    outputs:
      image-tags: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Enable Gradle caching for faster builds
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Build and Create Fat JAR
        run: ./gradlew :${{ inputs.component }}:shadowJar -x detekt

      - name: Run Tests
        run: ./gradlew test -x detekt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ inputs.component }}
          path: |
            common-models/build/test-results/
            service/build/test-results/
            ui/build/test-results/
            e2e/build/test-results/
          retention-days: 30

      - name: Log in to Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generate semantic version tags (latest, SHA, run number)
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ inputs.image_name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=raw,value=v${{ github.run_number }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.component }}
          push: true
          file: ${{ inputs.component }}/prod.Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # Scan container for vulnerabilities
      - name: Pull image for scanning
        continue-on-error: true
        run: docker pull ${{ env.REGISTRY }}/${{ inputs.image_name }}:latest

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.35.0
        continue-on-error: true
        with:
          image-ref: ${{ env.REGISTRY }}/${{ inputs.image_name }}:latest
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Cleanup old package versions
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: ${{ inputs.package_name }}
          package-type: 'container'
          min-versions-to-keep: 5

  deploy:
    needs: build-and-push-image
    name: Deploy to Production
    runs-on: self-hosted
    timeout-minutes: 10
    concurrency:
      group: deploy-${{ inputs.component }}
      cancel-in-progress: false

    environment:
      name: production
      url: http://member.dallasmakerspace.org

    steps:
      - name: Log in to Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.PAT }}

      - name: Pull latest Docker image
        shell: bash
        run: |
          docker pull ${{ env.REGISTRY }}/${{ inputs.image_name }}:latest

      - name: Determine deploy colors
        shell: bash
        run: |
          STATE_FILE="/opt/portal/state/${{ inputs.component }}.live"
          if [ -f "$STATE_FILE" ]; then
            LIVE=$(cat "$STATE_FILE")
          else
            LIVE=$(docker ps \
              --filter "label=portal.component=${{ inputs.component }}" \
              --format '{{.Label "portal.color"}}' | head -1)
          fi

          if [ -z "$LIVE" ]; then
            LIVE="none"
            NEW="blue"
          elif [ "$LIVE" = "blue" ]; then
            NEW="green"
          else
            NEW="blue"
          fi

          echo "LIVE=$LIVE"   >> "$GITHUB_ENV"
          echo "NEW=$NEW"     >> "$GITHUB_ENV"
          echo "NEW_NAME=${{ inputs.container_name }}-${NEW}" >> "$GITHUB_ENV"
          echo "OLD_NAME=${{ inputs.container_name }}-${LIVE}" >> "$GITHUB_ENV"
          echo "Deploying $NEW (candidate) — current live: $LIVE"

      - name: Start candidate container
        shell: bash
        run: |
          EXTRA_NETWORKS="${{ inputs.additional_networks }}"

          if [ "${{ inputs.component }}" = "ui" ]; then
            TRAEFIK_LABELS="\
              --label traefik.enable=true \
              --label traefik.http.services.ui-${NEW}.loadbalancer.server.port=${{ inputs.internal_port }} \
              --label traefik.http.services.ui-${NEW}.loadbalancer.healthcheck.path=${{ inputs.healthcheck_path }} \
              --label traefik.http.services.ui-${NEW}.loadbalancer.healthcheck.interval=5s \
              --label traefik.http.services.ui-${NEW}.loadbalancer.healthcheck.timeout=2s"
            NETWORK_FLAGS="--network member-portal"
          else
            TRAEFIK_LABELS="\
              --label traefik.enable=true \
              --label traefik.http.services.service-${NEW}.loadbalancer.server.port=${{ inputs.internal_port }} \
              --label traefik.http.services.service-${NEW}.loadbalancer.healthcheck.path=${{ inputs.healthcheck_path }} \
              --label traefik.http.services.service-${NEW}.loadbalancer.healthcheck.interval=5s \
              --label traefik.http.services.service-${NEW}.loadbalancer.healthcheck.timeout=2s"
            # No alias here — alias is attached after readiness check (see "Attach service alias" step)
            # to prevent Docker DNS from routing internal traffic to the container before it is ready.
            NETWORK_FLAGS="--network member-portal"
          fi

          ENV_FILE=$(eval echo "${{ inputs.env_file_path }}")
          docker run -d --restart unless-stopped \
            $NETWORK_FLAGS \
            --env-file "$ENV_FILE" \
            --name "$NEW_NAME" \
            --label "portal.component=${{ inputs.component }}" \
            --label "portal.color=$NEW" \
            $TRAEFIK_LABELS \
            "${{ env.REGISTRY }}/${{ inputs.image_name }}:latest"

          echo "Started $NEW_NAME"

      - name: Wait for readiness
        shell: bash
        run: |
          echo "Waiting for $NEW_NAME to become ready..."
          for i in $(seq 1 30); do
            if docker exec "$NEW_NAME" wget -qO- --timeout=2 \
                "http://127.0.0.1:${{ inputs.internal_port }}${{ inputs.healthcheck_path }}" \
                > /dev/null 2>&1; then
              echo "Ready after $((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "Container failed to become ready in 60s — dumping logs:"
          docker logs "$NEW_NAME" --tail 100
          exit 1

      - name: Attach service alias
        shell: bash
        run: |
          if [ "${{ inputs.component }}" = "ui" ]; then
            echo "UI — no alias attachment needed"
            exit 0
          fi

          EXTRA_NETWORKS="${{ inputs.additional_networks }}"

          # Reconnect with the DNS alias now that the container is confirmed ready.
          # Docker stores aliases set via 'docker network connect' in the container's endpoint
          # config, so the alias survives container restarts.
          docker network disconnect member-portal "$NEW_NAME"
          docker network connect --alias member-profile-service member-portal "$NEW_NAME"

          if [ -n "$EXTRA_NETWORKS" ]; then
            for network in $EXTRA_NETWORKS; do
              docker network connect --alias member-profile-service "$network" "$NEW_NAME"
            done
          fi

          echo "Alias 'member-profile-service' attached to $NEW_NAME"

      - name: Prime new container
        shell: bash
        continue-on-error: true
        run: |
          NEW_IP=$(docker inspect "$NEW_NAME" \
            --format '{{(index .NetworkSettings.Networks "member-portal").IPAddress}}')
          echo "Priming $NEW_NAME at ${NEW_IP}:${{ inputs.internal_port }} (3 requests to warm JVM)..."
          for i in 1 2 3; do
            curl -s -o /dev/null \
              -w "Prime $i: HTTP %{http_code} (%{time_total}s)\n" \
              --max-time 10 \
              "http://${NEW_IP}:${{ inputs.internal_port }}${{ inputs.healthcheck_path }}" || true
          done

      - name: Wait for Traefik to confirm new backend healthy
        shell: bash
        run: |
          if [ "${{ inputs.component }}" = "ui" ]; then
            SVC="ui-${NEW}@docker"
          else
            SVC="service-${NEW}@docker"
          fi
          echo "Waiting for Traefik to report $SVC as UP..."
          for i in $(seq 1 20); do
            STATUS=$(curl -sf "http://localhost:8082/api/http/services/$SVC" 2>/dev/null \
              | grep -o '"UP"' | head -1 || echo "")
            if [ "$STATUS" = '"UP"' ]; then
              echo "Traefik confirmed $SVC UP after $((i * 3))s"
              exit 0
            fi
            sleep 3
          done
          echo "WARNING: Traefik did not confirm backend UP in 60s — proceeding anyway"

      - name: Cutover traffic to new container
        shell: bash
        run: |
          EXTRA_NETWORKS="${{ inputs.additional_networks }}"

          if [ "${{ inputs.component }}" = "ui" ]; then
            cat > /tmp/ui-weights-new.yml <<EOF
          http:
            routers:
              ui:
                rule: "PathPrefix(\`/\`)"
                entryPoints:
                  - web
                service: ui-weighted
            services:
              ui-weighted:
                weighted:
                  services:
                    - name: "ui-${NEW}@docker"
                      weight: 100
          EOF
            mv /tmp/ui-weights-new.yml /opt/member-profile-traefik/dynamic/ui-weights.yml
            echo "Traffic shifted to ui-${NEW}@docker (Traefik reloads within ~1s)"
          else
            cat > /tmp/service-weights-new.yml <<EOF
          http:
            routers:
              service:
                rule: "PathPrefix(\`/\`)"
                entryPoints:
                  - service
                service: service-weighted
            services:
              service-weighted:
                weighted:
                  services:
                    - name: "service-${NEW}@docker"
                      weight: 100
          EOF
            mv /tmp/service-weights-new.yml /opt/member-profile-traefik/dynamic/service-weights.yml
            echo "Traffic shifted to service-${NEW}@docker (Traefik reloads within ~1s)"
            sleep 3   # let Traefik drain in-flight requests from OLD before yanking its network

            # Disconnect old container from Docker networks to stop internal (alias) traffic too
            if [ "$LIVE" != "none" ]; then
              docker network disconnect member-portal "$OLD_NAME" || true
              if [ -n "$EXTRA_NETWORKS" ]; then
                for network in $EXTRA_NETWORKS; do
                  docker network disconnect "$network" "$OLD_NAME" || true
                done
              fi
            fi
          fi

          # Record cutover and persist live color atomically with the traffic shift
          echo "CUTOVER_DONE=1" >> "$GITHUB_ENV"
          mkdir -p /opt/portal/state
          echo "$NEW" > /opt/portal/state/${{ inputs.component }}.live
          echo "${{ inputs.component }} live = $NEW"

      - name: Drain and remove old container
        shell: bash
        run: |
          if [ "$LIVE" = "none" ]; then
            echo "First deploy — no old container to drain"
            exit 0
          fi
          echo "Draining $OLD_NAME for 30s..."
          sleep 30
          docker update --restart=no "$OLD_NAME" || true
          docker stop --time 30 "$OLD_NAME" || true
          docker rm "$OLD_NAME" || true
          echo "Removed $OLD_NAME"

      - name: Rollback on failure
        if: failure()
        shell: bash
        run: |
          if [ -z "$NEW_NAME" ]; then
            echo "Colors were not determined — nothing to roll back"
            exit 0
          fi

          echo "Deploy failed — rolling back..."
          EXTRA_NETWORKS="${{ inputs.additional_networks }}"

          docker update --restart=no "$NEW_NAME" 2>/dev/null || true
          docker stop "$NEW_NAME" 2>/dev/null || true
          docker rm "$NEW_NAME" 2>/dev/null || true

          if [ "${CUTOVER_DONE:-0}" = "1" ]; then
            # Cutover ran: regenerate weights pointing back to the previously live color,
            # restore the state file, and (for service) reconnect the old container to Docker
            # networks so alias-based internal traffic resumes.
            if [ "${{ inputs.component }}" = "ui" ]; then
              cat > /opt/member-profile-traefik/dynamic/ui-weights.yml <<EOF
          http:
            routers:
              ui:
                rule: "PathPrefix(\`/\`)"
                entryPoints:
                  - web
                service: ui-weighted
            services:
              ui-weighted:
                weighted:
                  services:
                    - name: "ui-${LIVE}@docker"
                      weight: 100
          EOF
              echo "UI weights restored to ui-${LIVE}@docker"
            else
              cat > /opt/member-profile-traefik/dynamic/service-weights.yml <<EOF
          http:
            routers:
              service:
                rule: "PathPrefix(\`/\`)"
                entryPoints:
                  - service
                service: service-weighted
            services:
              service-weighted:
                weighted:
                  services:
                    - name: "service-${LIVE}@docker"
                      weight: 100
          EOF
              echo "Service weights restored to service-${LIVE}@docker"
              if [ "$LIVE" != "none" ]; then
                docker network connect --alias member-profile-service member-portal "$OLD_NAME" 2>/dev/null || true
                if [ -n "$EXTRA_NETWORKS" ]; then
                  for network in $EXTRA_NETWORKS; do
                    docker network connect --alias member-profile-service "$network" "$OLD_NAME" 2>/dev/null || true
                  done
                fi
              fi
            fi

            mkdir -p /opt/portal/state
            if [ "$LIVE" = "none" ]; then
              rm -f /opt/portal/state/${{ inputs.component }}.live
            else
              echo "$LIVE" > /opt/portal/state/${{ inputs.component }}.live
            fi
            echo "State file restored to $LIVE"
          else
            echo "Cutover did not run — weights and state file are unchanged"
          fi

          echo "Rollback complete — $OLD_NAME should still be serving"

      - name: Cleanup old Docker images
        shell: bash
        continue-on-error: true
        run: |
          echo "Cleaning up old Docker images..."
          docker images "${{ env.REGISTRY }}/${{ inputs.image_name }}" --format "{{.ID}} {{.Tag}}" | \
            grep -v "latest" | \
            awk '{print $1}' | \
            xargs -r docker rmi || true

          docker image prune -f

          echo "Cleanup complete. Current images:"
          docker images "${{ env.REGISTRY }}/${{ inputs.image_name }}" --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"
