name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: eclipse-temurin:21-jdk-jammy

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: never

      - name: Run unit tests
        run: ./gradlew test -x :e2e:test

      # Reported from the workspace directly, so no test-results artifact is uploaded.
      - name: Publish unit test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Unit tests
          path: '**/build/test-results/**/TEST-*.xml'
          reporter: java-junit

  e2e-tests:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright/java:v1.60.0-noble
      options: --ipc=host

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: example
          MARIADB_DATABASE: member_profile
          MARIADB_USER: member-profile-user
          MARIADB_PASSWORD: dummy-password-for-dev
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_URL: jdbc:mariadb://mariadb:3306/member_profile
      DB_USER: member-profile-user
      DB_PASSWORD: dummy-password-for-dev
      DB_MASTER_URL: jdbc:mariadb://mariadb:3306/member_profile
      DB_MASTER_USER: member-profile-user
      DB_MASTER_PASSWORD: dummy-password-for-dev
      DEV_MODE: true
      ENV_DEV_MODE: true
      E2E_BASE_URL: http://127.0.0.1:8000
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: never

      - name: Initialize database
        run: |
          apt-get update
          apt-get install -y curl mariadb-client
          mariadb -h mariadb -P 3306 -u "$DB_MASTER_USER" -p"$DB_MASTER_PASSWORD" member_profile \
            < service/docs/sql/create.sql

      - name: Build service and UI jars
        run: ./gradlew :service:shadowJar :ui:shadowJar

      # Each app runs from its module dir, mirroring Gradle's run task.
      - name: Start service and UI
        run: |
          (cd service && exec java -jar build/libs/service-all.jar > /tmp/service.log 2>&1) &
          echo $! > /tmp/service.pid
          (cd ui && exec java -jar build/libs/ui-all.jar > /tmp/ui.log 2>&1) &
          echo $! > /tmp/ui.pid
          sleep 5
          for app in service ui; do
            if ! kill -0 "$(cat /tmp/$app.pid)" 2>/dev/null; then
              echo "$app exited before it could start"
              tail -200 /tmp/$app.log
              exit 1
            fi
          done

      - name: Wait for service and UI
        run: |
          for attempt in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8081/health/ready >/dev/null \
              && curl -sf http://127.0.0.1:8000/readyz >/dev/null; then
              echo "Apps ready after attempt ${attempt}"
              exit 0
            fi
            for app in service ui; do
              if ! kill -0 "$(cat /tmp/$app.pid)" 2>/dev/null; then
                echo "$app exited while waiting for apps"
                tail -200 /tmp/$app.log
                exit 1
              fi
            done
            echo "Waiting for service (:8081) and UI (:8000)... (${attempt}/90)"
            sleep 5
          done
          for app in service ui; do
            echo "=== $app log (last 200 lines) ==="
            tail -200 /tmp/$app.log
          done
          exit 1

      - name: Run Playwright e2e tests
        run: ./gradlew :e2e:test

      - name: Stop service and UI
        if: always()
        run: |
          for app in service ui; do
            if [ -f /tmp/$app.pid ]; then
              kill "$(cat /tmp/$app.pid)" 2>/dev/null || true
            fi
          done

      - name: Publish e2e test results
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: E2E tests
          path: '**/build/test-results/**/TEST-*.xml'
          reporter: java-junit

      # The CD workflows deploy exactly these jars (see common-cd.yml), so what e2e tests is what ships.
      # Uploaded only after e2e passes and only for master (the only branch CD deploys); CD deletes
      # each one after deploying it, and artifact-cleanup.yml removes any left over.
      - name: Upload service jar
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: service-jar
          path: service/build/libs/service-all.jar
          retention-days: 1
          compression-level: 0

      - name: Upload UI jar
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: ui-jar
          path: ui/build/libs/ui-all.jar
          retention-days: 1
          compression-level: 0

      - name: Upload app logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: app-logs
          path: |
            /tmp/service.log
            /tmp/ui.log
          retention-days: 1
