ktor {
  development = true
  development = ${?DEV_MODE}
  deployment {
    port = 8081
    port = ${?ENV_PORT}
    requestReadTimeoutSeconds = 60
    requestReadTimeoutSeconds = ${?KTOR_REQUEST_READ_TIMEOUT}
    responseWriteTimeoutSeconds = 60
    responseWriteTimeoutSeconds = ${?KTOR_RESPONSE_WRITE_TIMEOUT}
    requestTimeoutSeconds = 120
    requestTimeoutSeconds = ${?KTOR_REQUEST_TIMEOUT}
  }
}
app {
  use-mock-services = true
  use-mock-services = ${?USE_MOCK_SERVICES}
  discourse {
    apiKey = "dummy-secret-for-dev"
    apiKey = ${?DISCOURSE_API_KEY}
  }
  guacamole {
    base-url = "http://localhost:8086/guacamole"
    base-url = ${?GUACAMOLE_BASE_URL}
    admin-username = "admin"
    admin-username = ${?GUACAMOLE_ADMIN_USERNAME}
    admin-password = "dummy-password-for-dev"
    admin-password = ${?GUACAMOLE_ADMIN_PASSWORD}
  }
  winrm {
    # Used to detect direct (non-Guacamole) RDP sessions on target machines. One shared
    # least-privilege service account (member of "Remote Management Users" locally on each
    # target, not local Administrators) is used against every machine.
    port = 5985
    port = ${?WINRM_PORT}
    # winrm4j takes a single username string with no separate domain field, so the domain must be
    # embedded in it via WINRM_USERNAME (DOMAIN\user or user@domain both work with NTLM) - a bare
    # username will resolve against the target's local accounts instead of the domain account.
    # If provisioning this account's local group membership via a Restricted Groups GPO, target an
    # AD group rather than the account directly - some environments silently no-op a bare-account
    # "Member Of" entry.
    username = "dummy-username-for-dev"
    username = ${?WINRM_USERNAME}
    password = "dummy-password-for-dev"
    password = ${?WINRM_PASSWORD}
    # Fast pre-flight TCP dial on the WinRM port before attempting the SOAP call.
    connect-timeout-ms = 500
    connect-timeout-ms = ${?WINRM_CONNECT_TIMEOUT_MS}
    # WS-Man server-side "how long may you hold this open" hint - not a hard client-side bound.
    operation-timeout-ms = 1200
    operation-timeout-ms = ${?WINRM_OPERATION_TIMEOUT_MS}
    # The real, hard deadline: enforced client-side via Future.get(timeout) around the blocking
    # WinRM call, since coroutine withTimeout does not interrupt blocking I/O (see the same
    # lesson already documented on CalendarRepository's JDBC timeout handling).
    call-timeout-ms = 1500
    call-timeout-ms = ${?WINRM_CALL_TIMEOUT_MS}
    executor-pool-size = 8
    executor-pool-size = ${?WINRM_EXECUTOR_POOL_SIZE}
  }
  smartwaiver {
    apiKey = "dummy-secret-for-dev"
    apiKey = ${?SMARTWAIVER_API_KEY}
  }
  notifications {
    sparkpost {
      api-key = "dummy-secret-for-dev"
      api-key = ${?SPARKPOST_API_KEY}
      from-email = "no-reply@dallasmakerspace.org"
      from-email = ${?SPARKPOST_FROM_EMAIL}
      from-name = "DMS Notifications"
      from-name = ${?SPARKPOST_FROM_NAME}
    }
    worker {
      # When false the background notification worker loop is not started.
      enabled = true
      enabled = ${?NOTIFICATIONS_WORKER_ENABLED}
      poll-interval-ms = 5000
      poll-interval-ms = ${?NOTIFICATIONS_POLL_INTERVAL_MS}
      batch-size = 50
      batch-size = ${?NOTIFICATIONS_WORKER_BATCH_SIZE}
      max-attempts = 5
      max-attempts = ${?NOTIFICATIONS_MAX_ATTEMPTS}
      retry-backoff-seconds = 60
      retry-backoff-seconds = ${?NOTIFICATIONS_RETRY_BACKOFF_SECONDS}
      retry-max-backoff-seconds = 21600
      retry-max-backoff-seconds = ${?NOTIFICATIONS_RETRY_MAX_BACKOFF_SECONDS}
    }
    digest {
      # When false the background digest loop is not started.
      enabled = true
      enabled = ${?NOTIFICATIONS_DIGEST_ENABLED}
      poll-interval-ms = 60000
      poll-interval-ms = ${?NOTIFICATIONS_DIGEST_POLL_INTERVAL_MS}
      batch-size = 200
      batch-size = ${?NOTIFICATIONS_DIGEST_BATCH_SIZE}
      max-attempts = 5
      max-attempts = ${?NOTIFICATIONS_DIGEST_MAX_ATTEMPTS}
      retry-backoff-seconds = 300
      retry-backoff-seconds = ${?NOTIFICATIONS_DIGEST_RETRY_BACKOFF_SECONDS}
      retry-max-backoff-seconds = 21600
      retry-max-backoff-seconds = ${?NOTIFICATIONS_DIGEST_RETRY_MAX_BACKOFF_SECONDS}
    }
  }
  llm {
    provider = "bedrock"
    provider = ${?LLM_PROVIDER}
  }
  openrouter {
    apiKey = "dummy-secret-for-dev"
    apiKey = ${?OPENROUTER_API_KEY}
    baseUrl = "https://openrouter.ai/api/v1"
    baseUrl = ${?OPENROUTER_BASE_URL}
    model = "google/gemini-3.1-flash-lite-preview"
    model = ${?OPENROUTER_MODEL}
  }
  bedrock {
    model = "us.anthropic.claude-haiku-4-5-20251001-v1:0"
    model = ${?BEDROCK_MODEL}
  }
  confluence {
    apiKey = "dummy-secret-for-dev"
    apiKey = ${?CONFLUENCE_API_KEY}
    baseUrl = "https://source.dallasmakerspace.org"
    baseUrl = ${?CONFLUENCE_BASE_URL}
  }
  askai {
    cache-ttl-days = 30
    cache-ttl-days = ${?ASKAI_CACHE_TTL_DAYS}
    max-search-results = 10
    max-search-results = ${?ASKAI_MAX_SEARCH_RESULTS}
    monthly-budget-usd = 12.0
    monthly-budget-usd = ${?ASKAI_MONTHLY_BUDGET_USD}
  }
  db {
    url = "jdbc:mariadb://localhost:3306/member_profile"
    url = ${?DB_URL}
    user = "member-profile-user"
    user = ${?DB_USER}
    password = "dummy-password-for-dev"
    password = ${?DB_PASSWORD}
  }
  db-master {
    url = "jdbc:mariadb://localhost:34407"
    url = ${?DB_MASTER_URL}
    user = "member_portal_svc"
    user = ${?DB_MASTER_USER}
    password = "dummy-password-for-dev"
    password = ${?DB_MASTER_PASSWORD}
  }
  api {
    # Number of API clients configured via indexed environment variables
    # API_CLIENT_0_NAME, API_CLIENT_0_KEY, API_CLIENT_0_ROLES
    # API_CLIENT_1_NAME, API_CLIENT_1_KEY, API_CLIENT_1_ROLES
    # etc.
    client-count = 1
    client-count = ${?API_CLIENT_COUNT}

    # Fallback for local development (when env vars are not set)
    # These are only used if API_CLIENT_0_NAME is not set
    fallback {
      name = "member-profile-ui"
      key = "dummy-key-for-dev"
      role = "UI_SUPERUSER"
    }
  }
  ldap {
    host = "localhost"
    host = ${?LDAP_HOST}
    port = 389
    port = ${?LDAP_PORT}
    user = "cn=admin,dc=dms,dc=local"
    user = ${?LDAP_USER}
    password = "Adm1n!"
    password = ${?LDAP_PASSWORD}
  }
  logging {
    level = "debug"
    level = ${?ENV_LOG_LEVEL}
    elastic-host = "localhost"
    elastic-host = ${?ENV_ELASTIC_HOST}
    elastic-api-key = "dummy-key-for-dev"
    elastic-api-key = ${?ENV_ELASTIC_API_KEY}
  }
  kibana {
    base-url = ""
    base-url = ${?KIBANA_BASE_URL}
    space = ""
    space = ${?KIBANA_SPACE}
    data-view = ""
    data-view = ${?KIBANA_DATA_VIEW}
  }
  door-controller {
    timeout-seconds = 15
    timeout-seconds = ${?DOOR_CONTROLLER_TIMEOUT}

    # HTTP web interface credentials
    username = "door-controller-username"
    username = ${?DOOR_CONTROLLER_USERNAME}
    password = "CHANGEME"
    password = ${?DOOR_CONTROLLER_PASSWORD}

    # Controller 1: Building 102 Normal Doors
    controller-1-name = "doors_normal_102"
    controller-1-ip = "127.0.0.1"
    controller-1-ip = ${?DOOR_CONTROLLER_1_IP}
    controller-1-serial = 1234
    controller-1-serial = ${?DOOR_CONTROLLER_1_SERIAL}
    controller-1-doors = "1,2,3,4"
    controller-1-doors = ${?DOOR_CONTROLLER_1_DOORS}

    # Controller 2: Building 104 Normal Doors
    controller-2-name = "doors_normal_104"
    controller-2-ip = "127.0.0.1"
    controller-2-ip = ${?DOOR_CONTROLLER_2_IP}
    controller-2-serial = 1234
    controller-2-serial = ${?DOOR_CONTROLLER_2_SERIAL}
    controller-2-doors = "1,2,3,4"
    controller-2-doors = ${?DOOR_CONTROLLER_2_DOORS}

    # Controller 3: Building 102 Special
    controller-3-name = "doors_special_102"
    controller-3-ip = "127.0.0.1"
    controller-3-ip = ${?DOOR_CONTROLLER_3_IP}
    controller-3-serial = 1234
    controller-3-serial = ${?DOOR_CONTROLLER_3_SERIAL}
    controller-3-doors = "1,4"
    controller-3-doors = ${?DOOR_CONTROLLER_3_DOORS}

    # Controller 4: Building 104 Special
    controller-4-name = "doors_special_104"
    controller-4-ip = "127.0.0.1"
    controller-4-ip = ${?DOOR_CONTROLLER_4_IP}
    controller-4-serial = 1234
    controller-4-serial = ${?DOOR_CONTROLLER_4_SERIAL}
    controller-4-doors = "4"
    controller-4-doors = ${?DOOR_CONTROLLER_4_DOORS}
  }
}